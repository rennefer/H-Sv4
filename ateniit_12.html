<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depth Walk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Egyptian+Hieroglyphs&display=swap">
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#e9e4d8; }
  canvas { display:block; touch-action:none; }

  #editor {
    position:fixed; top:0; right:0; width:440px; height:100%; box-sizing:border-box;
    background:#fdf8ec; border-left:1px solid rgba(40,30,20,0.25);
    font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#2a1f14; padding:18px; overflow-y:auto;
  }
  #editor[hidden] { display:none; }
  #editor h2 { font-size:17px; margin:0 0 6px; }
  #editor .hint { font-size:12px; color:#6b5a45; margin:0 0 14px; }
  #editor label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:0.04em; color:#6b5a45; margin:14px 0 5px; }
  #palette {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(34px, 1fr)); gap:4px;
    max-height:44vh; overflow-y:auto; border:1px solid rgba(40,30,20,0.2);
    padding:5px; background:#fff;
  }
  .palette-btn {
    font-family: "Noto Sans Egyptian Hieroglyphs"; font-size:22px;
    width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    background:#fdf8ec; border:1px solid rgba(40,30,20,0.15); border-radius:3px; cursor:pointer;
  }
  .palette-btn:hover { background:#f0e7d2; }
  .palette-btn.active { background:#e3b98c; border-color:#a06a2e; }
  #scaleRow { display:flex; align-items:center; gap:8px; }
  #scaleRow input[type=range] { flex:1; }
  #scaleValue { font-variant-numeric: tabular-nums; min-width:2.6em; text-align:right; }
  .row { display:flex; align-items:center; gap:6px; margin-top:8px; }
  #editor button {
    font: inherit; padding:6px 10px; border:1px solid #a06a2e; background:#e3b98c;
    color:#2a1f14; border-radius:4px; cursor:pointer; margin-top:8px; margin-right:6px;
  }
  #editor button:hover { background:#d9ab74; }
  #editor button:disabled { opacity:0.55; cursor:default; }
  #editor textarea {
    width:100%; box-sizing:border-box; height:90px; margin-top:6px; font:11px/1.3 monospace;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="editor" hidden>
  <h2>Level Editor</h2>
  <p class="hint">Press E to close. Click the map to place the selected sign, click a placed sign to select it, then drag it to move it. Del removes the selection.</p>
  <label>Sign palette</label>
  <div id="palette"></div>
  <label>Size</label>
  <div id="scaleRow">
    <input type="range" id="scaleSlider" min="0.3" max="3" step="0.05" value="1">
    <span id="scaleValue">1.00x</span>
  </div>
  <div class="row">
    <input type="checkbox" id="pickupCheck">
    <label style="margin:0; text-transform:none; letter-spacing:0; font-size:13px;" for="pickupCheck">Pickupable</label>
  </div>
  <div class="row">
    <input type="checkbox" id="mirrorCheck">
    <label style="margin:0; text-transform:none; letter-spacing:0; font-size:13px;" for="mirrorCheck">Mirrored (face right)</label>
  </div>
  <div class="row">
    <input type="checkbox" id="noHitboxCheck">
    <label style="margin:0; text-transform:none; letter-spacing:0; font-size:13px;" for="noHitboxCheck">No hitbox (walk through)</label>
  </div>
  <div>
    <button id="deleteBtn">Delete selected</button>
  </div>
  <label>Map</label>
  <div>
    <button id="map1Btn">Lvl 1</button>
    <button id="mapNeg1Btn">Lvl -1</button>
  </div>
  <div class="row">
    <input type="checkbox" id="debugCheck">
    <label style="margin:0; text-transform:none; letter-spacing:0; font-size:13px;" for="debugCheck">Show hitboxes</label>
  </div>
  <label>Level data</label>
  <div>
    <button id="exportBtn">Export</button>
    <button id="importBtn">Import</button>
  </div>
  <textarea id="levelJson" placeholder="Exported JSON appears here — paste JSON here and click Import to load it."></textarea>
</div>
<script>
(function(){
"use strict";

/* ============================================================
   DEPTH WALK — motion only, no scenery.
   Arrow keys / WASD move the player, which alternates between
   Gardiner A1 and A2 while moving, and rests on A1 when still.
   Moving up shrinks it toward the background; moving down
   grows it toward the foreground. Three fixed depth anchors
   shape the scale curve.
   ============================================================ */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const HIERO_FONT = '"Noto Sans Egyptian Hieroglyphs"';
const A1 = String.fromCodePoint(0x13000); // seated man — idle / walk frame 1

const A9 = String.fromCodePoint(0x1300B); // player, while carrying the cow

const A31 = String.fromCodePoint(0x13023);

const N6 = String.fromCodePoint(0x131F4); // sun disk — the lady's reward, rendered in gold

let fontsReady = false;
Promise.all([

/* ---------- depth anchors ----------
   y is a fraction of canvas height (0 = top/far, 1 = bottom/near).
   Scale is interpolated linearly between the two anchors the
   player currently sits between. */
const DEPTH_ANCHORS = [
  [0.10, 0.35],   // background
  [0.40, 0.58],   // background -> midground seam
  [0.72, 0.88],   // midground -> foreground seam
  [0.96, 1.35],   // foreground
];
function scaleForY(y){
  for(let i=0; i<DEPTH_ANCHORS.length-1; i++){
    const [y0,s0] = DEPTH_ANCHORS[i], [y1,s1] = DEPTH_ANCHORS[i+1];
    if(y>=y0 && y<=y1){
      const t = (y-y0)/(y1-y0);
      return s0 + (s1-s0)*t;
    }
  }
  return y < DEPTH_ANCHORS[0][0] ? DEPTH_ANCHORS[0][1] : DEPTH_ANCHORS[DEPTH_ANCHORS.length-1][1];
}

const BOUNDS = { xMin:0.035, xMax:0.965, yMin:DEPTH_ANCHORS[0][0], yMax:DEPTH_ANCHORS[DEPTH_ANCHORS.length-1][0] };

/* ---------- the river ----------
   A closed polygon (traced from the reference map) marking the water.
   Wading in it without a boat is slow and draws a crocodile; a boat
   parked in it can be boarded and is confined to it until it beaches. */
const WATER_POLY = [[0.0046,0.0491],[0.0083,0.0369],[0.0495,0.0442],[0.1001,0.0971],[0.1264,0.14],[0.1863,0.1929],[0.2926,0.1904],[0.5243,0.2162],[0.6956,0.2113],[0.7621,0.2002],[0.8586,0.2027],[0.9025,0.1843],[0.9917,0.1916],[0.9943,0.2912],[0.9799,0.3108],[0.9205,0.2961],[0.8829,0.301],[0.8555,0.3219],[0.7967,0.3194],[0.7028,0.3354],[0.6806,0.3501],[0.6228,0.3428],[0.5294,0.3649],[0.4603,0.335],[0.2786,0.335],[0.1223,0.3219],[0.1146,0.301],[0.0743,0.2801],[0.0057,0.2727]];
function pointInPolygon(x, y, poly){
  let inside = false;
  for(let i=0, j=poly.length-1; i<poly.length; j=i++){
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    const intersect = ((yi>y) !== (yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi);
    if(intersect) inside = !inside;
  }
  return inside;
}
function isInWater(x, y){ return currentMap === 1 && pointInPolygon(x, y, WATER_POLY); } // no river outside the main map
const BOAT_WATER_SNAP = 0.14; // fraction of min(W,H) — how close a boat drop needs to be to the river to snap into it
// Finds the closest point in (or on the edge of) the river to (x,y) —
// used to snap a dropped boat into the water even if it lands a bit short,
// since the river band is thin enough that hitting it exactly (especially
// approaching from the south) is fiddly.
function nearestWaterPoint(x, y){
  if(isInWater(x, y)) return [x, y];
  let best = null, bestDist = Infinity;
  for(let i=0, j=WATER_POLY.length-1; i<WATER_POLY.length; j=i++){
    const ax=WATER_POLY[j][0], ay=WATER_POLY[j][1], bx=WATER_POLY[i][0], by=WATER_POLY[i][1];
    const dx=bx-ax, dy=by-ay;
    const lenSq = dx*dx+dy*dy;
    let t = lenSq>0 ? ((x-ax)*dx+(y-ay)*dy)/lenSq : 0;

    const nx = ax+t*dx, ny = ay+t*dy;
    const d = Math.hypot(nx-x, ny-y);
    if(d < bestDist){ bestDist = d; best = [nx, ny]; }
  }
  // step a hair past the bank, into the water's own interior, so it reads
  // as floating rather than balanced right on the edge
  const dx = best[0]-x, dy = best[1]-y;
  const len = Math.hypot(dx,dy) || 1;
  const nudged = [best[0] + (dx/len)*0.01, best[1] + (dy/len)*0.01];
  return isInWater(nudged[0], nudged[1]) ? nudged : best;
}
// The plain box-based crop used for anything floating/submerged (the boat,
// the crocodile): shows the top `frac` of the glyph's nominal size box.
function clipToTopFraction(cx, cy, size, frac){
  ctx.beginPath();
  ctx.rect(cx-size, cy-size*0.5, size*2, size*frac);
  ctx.clip();
}
// Same idea for the player wading, but pinned so the head can never be cut
// off: hieroglyph glyphs don't sit centered in their nominal box the way
// Latin letters do, so a plain box crop was chopping heads off some of
// them. This measures the glyph's actual drawn ink and, if it turns out to
// reach higher than the box assumed, extends the window up to cover it —
// the crop window only ever grows upward from the box default, never
// shrinks, so it can't introduce the opposite problem (over-cropping).
function clipHeadSafe(cx, cy, glyph, size, frac){
  ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  const m = ctx.measureText(glyph);
  const boxTop = cy - size*0.5;
  const inkTop = cy - m.actualBoundingBoxAscent;
  const top = Math.min(boxTop, inkTop);
  ctx.beginPath();
  ctx.rect(cx-size, top, size*2, size*frac);
  ctx.clip();
}

/* ---------- the duck (level object id 119) ----------
   A resting G039 sitting duck that spooks and flies off — up and off to
   whichever side the player isn't approaching from — once you get close,
   flapping between G040/G041 the whole way until it's off the map. */
const DUCK_ID = 119;
const DUCK_APPROACH_RANGE = 0.22; // fraction of min(W,H) — how close startles it
const DUCK_FLAP_INTERVAL = 0.12;  // seconds per wingbeat
const DUCK_FLY_SPEED = 0.16;      // fraction of canvas per second
let duckObj = levelObjects.find(o => o.id === DUCK_ID) || null;
let duckFlying = false;
let duckVX = 0, duckVY = 0;
let duckAnimT = 0, duckAnimFrame = 0;

function updateDuck(dt){
  if(!duckObj) return; // never existed, or already flew off for good

  if(!duckFlying){
    const dist = Math.hypot((player.x-duckObj.x)*W, (player.y-duckObj.y)*H);
    if(dist < Math.min(W,H)*DUCK_APPROACH_RANGE){
      duckFlying = true;
      const sideDir = (player.x <= duckObj.x) ? 1 : -1; // away from the approaching player
      duckVX = DUCK_FLY_SPEED * 0.55 * sideDir;
      duckVY = -DUCK_FLY_SPEED; // up — scaleForY shrinks it as it climbs, like receding into the distance
      duckAnimT = 0; duckAnimFrame = 0;
    }
    return;
  }

  duckObj.x += duckVX * dt;
  duckObj.y += duckVY * dt;

  duckAnimT += dt;
  if(duckAnimT >= DUCK_FLAP_INTERVAL){
    duckAnimT = 0;
    duckAnimFrame = duckAnimFrame === 0 ? 1 : 0;
  }

  // gone for good once it's flown off the map
  if(duckObj.x < -0.08 || duckObj.x > 1.08 || duckObj.y < -0.08){
    const idx = levelObjects.indexOf(duckObj);
    if(idx !== -1) levelObjects.splice(idx, 1);
    duckObj = null;
    duckFlying = false;
  }
}

/* ---------- the lady (level object id 115) ----------
   Sits between the harp and the archway. Bring her 5 of the pickup birds
   already scattered around the level (each a different sign) and she
   hands back a golden N6. */
const LADY_ID = 115;
const BIRD_IDS = [6, 152, 155, 157, 158]; // the level's 5 pickup-bird signs
const LADY_TALK_RANGE = 0.24; // fraction of min(W,H) — matches the main npc's

// called from tryDropHeldItem() — handing her one of the birds while close

function tryGiveBirdToLady(item){
  if(currentMap !== 1 || birdQuestDone || !ladyObj || item.kind !== 'level' || !BIRD_IDS.includes(item.id)) return false;
  const dist = Math.hypot((player.x-ladyObj.x)*W, (player.y-ladyObj.y)*H);
  if(dist >= Math.min(W,H)*LADY_TALK_RANGE) return false;

  birdsDelivered++;
  if(birdsDelivered >= BIRD_IDS.length){
    birdQuestDone = true;
    // straight onto the player's head, worn like the boat — not left on the ground
    heldItem = { kind:'level', id: nextObjId++, glyph: N6, scale: 1, mirror: false, noHitbox: true, pickup: true, golden: true };
  }
  return true;
}

};

/* ---------- cow ----------
   Rests at its base spot. Once the player gets close it drifts slowly
   two of its own widths to the left, stops, then drifts back — mirroring
   the moment it turns to head back to the right. */
const cow = {
  x:0.16, y:0.52, baseX:0.16, baseY:0.52, // midground, off to the left
  state:'idle', pauseT:0, facing:1, carried:false, placed:false, settleCooldown:0
};
const COW_APPROACH_RANGE = 0.30; // fraction of min(W,H) — how close triggers the drift
const COW_MOVE_SPEED = 0.045;    // fraction of canvas width per second — slow
const COW_PAUSE = 0.7;           // seconds paused at the far-left point

function onSpacePress(){
  if(editMode) return; // editing has its own click-based controls
  if(boarded) return; // hands are busy steering — can't pick up or drop while aboard
  if(heldItem){ tryDropHeldItem(); return; }
  tryPickup();
}

// the boat's pick-from/drop-onto reach — used by both nearestBase() and the
// debug overlay, so the two can never drift apart the way earlier hitboxes did.
// Sized directly off a reference screenshot where the boat's own size was
// measured against a hand-drawn circle showing exactly how far out picking
// things out of the ship should reach: about 1.45x the boat's size to
// either side, 0.5x above it (already clears the masthead) and a full 1.2x
// below it — reaching well past the hull into where you'd actually be
// standing on the bank or wading up to it. All as fractions of boatSize
// (not flat pixels), so it scales correctly at any depth/window size, with
// a small flat floor under each just so a boat far enough away to be
// nearly a dot doesn't shrink its own reach away to nothing.
function boatCatchZone(){
  const s = scaleForY(boatOnGround.y);
  const boatSize = Math.min(W,H) * BOAT_SIZE_MULT * s * BOAT_DROP_SCALE;
  const bx = boatOnGround.x*W, by = boatOnGround.y*H;
  const floor = Math.min(W,H) * 0.05;
  const halfW = Math.max(boatSize*1.45, floor);
  const topY = by - Math.max(boatSize*0.5, floor);
  const botY = by + Math.max(boatSize*1.2, floor*1.2);
  return { bx, by, halfW, topY, botY };
}

// the nearest thing in the world that can be stacked onto, or lifted from —
// the boat (once it's on the ground) and every placed sign
function nearestBase(){
  let best = null, bestKind = null, bestDist = Infinity;
  if(boatOnGround){
    const { bx, by, halfW, topY, botY } = boatCatchZone();
    const px = player.x*W, py = player.y*H;
    if(px > bx-halfW && px < bx+halfW && py > topY && py < botY){
      const d = Math.hypot(px-bx, py-by);
      if(d < bestDist){ best = boatOnGround; bestKind = 'boat'; bestDist = d; }
    }
  }
  for(const obj of levelObjects){
    const d = Math.hypot((player.x-obj.x)*W, (player.y-obj.y)*H);
    if(d < Math.min(W,H)*CAPTURE_RANGE && d < bestDist){ best = obj; bestKind = 'level'; bestDist = d; }
  }
  return best ? { base:best, kind:bestKind } : null;
}

function tryPickup(){
  const nb = nearestBase();
  if(nb){
    const { base, kind } = nb;
    if(base.items && base.items.length){
      // a stack always gives up whatever was placed on it last
      pickUpItem(base.items.pop());
      return;
    }
    if(kind === 'boat'){
      boatOnGround = null;
      heldItem = { kind:'boat' };
      return;
    }
    if(kind === 'level' && base.pickup){
      levelObjects.splice(levelObjects.indexOf(base), 1);
      if(selectedObjId === base.id) selectedObjId = null;
      if(base.id === BODY_ID && !bodyPenaltyGiven){
        score -= 30; // disturbing the body in the pyramid costs you
        bodyPenaltyGiven = true;
      }
      heldItem = { kind:'level', id:base.id, glyph:base.glyph, scale:base.scale, mirror:base.mirror, noHitbox:base.noHitbox, pickup:base.pickup, golden:base.golden };
      return;
    }
    // the base itself can't be lifted and has nothing left on it — fall through
  }
  // the free-roaming cow, if it isn't already tucked away in a stack somewhere
  if(!cow.placed){
    const dist = Math.hypot((player.x-cow.x)*W, (player.y-cow.y)*H);
    if(dist < Math.min(W,H)*CAPTURE_RANGE) pickUpItem({ kind:'cow' });
  }
}

function pickUpItem(item){
  heldItem = item;
  if(item.kind === 'cow'){ cow.carried = true; cow.placed = false; cow.state = 'carried'; }
}

function tryDropHeldItem(){
  const item = heldItem;
  heldItem = null;

  // handing one of the sacred birds to the lady while close enough feeds
  // her quest instead of just setting it down
  if(tryGiveBirdToLady(item)) return;

  // the boat only ever sits as its own base in the world — everything else
  // (the cow, any pickupable sign) is happy to stack onto whatever's nearby.
  // Two exceptions always go in loose, never stacked: the cow dropped into
  // the river (a boat-riding cow can't be hunted by the crocodile — that'd
  // defeat the whole point of the drop), and the golden reward set down
  // between the pillars (otherwise it just stacks onto the nearest obelisk
  // and the score for placing it never fires).
  const cowIntoWater = item.kind === 'cow' && isInWater(player.x, player.y);
  const goldenAtPillars = item.golden && nearPillars(player.x, player.y);
  if(item.kind !== 'boat' && !cowIntoWater && !goldenAtPillars){
    const nb = nearestBase();
    if(nb){
      nb.base.items = nb.base.items || [];
      nb.base.items.push(item);
      settleDroppedItem(item, true);
      return;
    }
  }
  settleDroppedItem(item, false);
}

// applies whatever's special about each kind once it comes to rest, whether
// it landed inside a stack or standalone on the ground
function settleDroppedItem(item, stacked){
  if(item.kind === 'cow'){
    cow.carried = false;
    if(stacked){
      cow.placed = true; // inert cargo now — no flee AI while it's tucked away on something
    } else {
      cow.placed = false;
      cow.x = player.x; cow.y = player.y;
      cow.baseX = player.x; cow.baseY = player.y; // its new "home" spot to flee from/return to
      cow.state = 'idle'; cow.pauseT = 0;
      cow.settleCooldown = 0.8; // a beat before it's willing to flee again
    }
    const distNpc = Math.hypot((player.x-npc.x)*W, (player.y-npc.y)*H);
    if(distNpc < Math.min(W,H)*NPC_TALK_RANGE){
      startNpcCelebration(); // he dances every time you bring it to him, wherever it lands
      if(!cowDelivered) score += 5; // saving the cow only pays out the first time
      cowDelivered = true; // the original "go find it" line is retired for good from the first delivery on
    }
  } else if(item.kind === 'boat' && !stacked){
    // a proper prize once it's off his head: 200% larger than the size he wore it at.
    // dropping it near the river snaps it the rest of the way in, so lining
    // it up exactly (especially approaching from the south bank) isn't fiddly.
    // Guarded by !stacked for the same reason as the level branch below: a
    // spare boat auto-dropped while boarding an already-placed one (tryAutoBoard
    // stacks whatever you're holding onto that boat's cargo) must NOT replace
    // boatOnGround here — that would swap out the boat you're standing in for
    // a brand new empty one and silently throw away everything on it.
    let bx = player.x, by = player.y;
    if(!isInWater(bx, by)){
      const [nx, ny] = nearestWaterPoint(bx, by);
      if(Math.hypot(nx-bx, ny-by) < BOAT_WATER_SNAP){ bx = nx; by = ny; }
    }
    boatOnGround = { x: bx, y: by, items: [] };
  } else if(item.kind === 'level' && !stacked){
    let dropX = player.x, dropY = player.y;
    if(item.golden && nearPillars(player.x, player.y)){
      const mid = pillarMidpoint();
      if(mid){ dropX = mid[0]; dropY = mid[1]; } // locks neatly between the two obelisks
      if(!goldenScored){ score += 5; goldenScored = true; }
    }
    levelObjects.push({
      id: item.id != null ? item.id : nextObjId++,
      glyph: item.glyph, x: dropX, y: dropY, scale: item.scale,
      pickup: item.pickup, mirror: item.mirror, noHitbox: item.noHitbox, items: [],
      golden: item.golden || false
    });
  }
}

function updateCow(dt){
  if(cow.carried || cow.placed) return; // riding on the player, or tucked away in a stack — no state of its own

  const cowSizePx = Math.min(W,H) * COW_SIZE_MULT * scaleForY(cow.y);
  const fleeDist = 2 * (cowSizePx / W); // "2 character distances"
  const leftX = cow.baseX - fleeDist;

  if(cow.state === 'idle'){
    if(cow.settleCooldown > 0){
      cow.settleCooldown -= dt;
    } else {
      const dist = Math.hypot((player.x-cow.x)*W, (player.y-cow.y)*H);
      if(dist < Math.min(W,H)*COW_APPROACH_RANGE) cow.state = 'fleeing';
    }
  } else if(cow.state === 'fleeing'){
    cow.facing = 1; // moving left — the sign's default orientation, no mirror
    cow.x = Math.max(leftX, cow.x - COW_MOVE_SPEED*dt);
    if(cow.x <= leftX){ cow.state = 'paused'; cow.pauseT = 0; }
  } else if(cow.state === 'paused'){
    cow.pauseT += dt;
    if(cow.pauseT >= COW_PAUSE) cow.state = 'returning';
  } else if(cow.state === 'returning'){
    cow.facing = -1; // moving right — mirror the sign
    cow.x = Math.min(cow.baseX, cow.x + COW_MOVE_SPEED*dt);
    if(cow.x >= cow.baseX) cow.state = 'idle';
  }
}

const NPC_TALK_RANGE = 0.24; // fraction of min(W,H) — how close before the bubble shows

/* ---------- NPC delivery celebration ----------
   Drop the cow next to him and he plays a little sequence — A28, A32,
   A31, A32, A29 — then slowly flips left/right five times before
   settling back on his resting sign, A26. */
const NPC_CELEBRATE_SEQUENCE = [A28, A32, A31, A32, A29];
const NPC_STEP_TIME = 0.35;   // seconds per pose in the sequence
const NPC_MIRROR_TIME = 0.45; // seconds per flip — "slowly"
const npcAnim = { phase:'idle', t:0, step:0, mirrors:0, facing:1 };

function startNpcCelebration(){
  npcAnim.phase = 'sequence';
  npcAnim.t = 0;
  npcAnim.step = 0;
  npcAnim.mirrors = 0;
  npcAnim.facing = 1;
}

function updateNpcAnim(dt){
  if(npcAnim.phase === 'idle') return;
  npcAnim.t += dt;

  if(npcAnim.phase === 'sequence'){
    if(npcAnim.t >= NPC_STEP_TIME){
      npcAnim.t = 0;
      npcAnim.step++;
      if(npcAnim.step >= NPC_CELEBRATE_SEQUENCE.length){
        npcAnim.phase = 'mirroring';
      }
    }
  } else if(npcAnim.phase === 'mirroring'){
    if(npcAnim.t >= NPC_MIRROR_TIME){
      npcAnim.t = 0;
      npcAnim.facing *= -1;
      npcAnim.mirrors++;
      if(npcAnim.mirrors >= 5){
        npcAnim.phase = 'idle';
        npcAnim.facing = 1;
        if(!boatRewarded){
          boatRewarded = true; // the reward for delivering the cow, once he's done celebrating — only granted the first time
          if(!heldItem) heldItem = { kind:'boat' }; // hands free — wear it
          else boatOnGround = { x: player.x, y: player.y, items: [] }; // hands full — it waits for you on the ground instead
        }
      }
    }
  }
}

function npcGlyph(){
  if(npcAnim.phase === 'sequence') return NPC_CELEBRATE_SEQUENCE[npcAnim.step];
  if(npcAnim.phase === 'mirroring') return A29; // mirror A29 itself, not the whole sequence
  return A26;
}

function wrapText(context, text, maxWidth){
  const words = text.split(' ');
  const lines = [];
  let line = '';
  words.forEach(word=>{
    const test = line ? line+' '+word : word;
    if(context.measureText(test).width > maxWidth && line){
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  });
  if(line) lines.push(line);
  return lines;
}

function drawSpeechBubble(cx, bottomY, text, fontSize){
  ctx.save();
  ctx.font = fontSize.toFixed(0)+'px '+HIERO_FONT;
  const lines = wrapText(ctx, text, 170);
  const lineH = fontSize*1.35;
  const padX = 12, padY = 10;
  let textW = 0;
  lines.forEach(l=>{ textW = Math.max(textW, ctx.measureText(l).width); });
  const w = textW+padX*2, h = lines.length*lineH+padY*2;
  const x = cx-w/2, y = bottomY-h;
  const r = 8;

  ctx.fillStyle = '#fdf8ec';
  ctx.strokeStyle = 'rgba(40,30,20,0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // tail pointing down at the speaker
  ctx.beginPath();
  ctx.moveTo(cx-7,y+h); ctx.lineTo(cx+7,y+h); ctx.lineTo(cx,y+h+8);
  ctx.closePath();
  ctx.fillStyle = '#fdf8ec';
  ctx.fill();

  ctx.fillStyle = '#2a1f14';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  lines.forEach((l,i)=> ctx.fillText(l, cx, y+padY+fontSize*0.85+i*lineH));
  ctx.restore();
}

function drawNpc(showBubble){
  const s = scaleForY(npc.y);
  const size = Math.min(W,H) * NPC_SIZE_MULT * s;
  const sx = npc.x*W, sy = npc.y*H;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(npcAnim.facing, 1);
  ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a1f14';
  ctx.fillText(npcGlyph(), 0, 0);
  ctx.restore();

  if(showBubble){
    let bubbleText = null;
    if(cowDelivered){
      // the second line only shows once his celebration animation has fully played out
      if(npcAnim.phase === 'idle') bubbleText = npc.lineWithCow;
    } else if(!(heldItem && heldItem.kind === 'cow')){
      bubbleText = npc.line; // while carrying the cow but not yet delivered, no bubble at all — no early flash of the second line
    }
    if(bubbleText) drawSpeechBubble(sx, sy-size*0.75, bubbleText, 22);
  }
}

function drawCow(){
  const s = scaleForY(cow.y);
  const size = Math.min(W,H) * COW_SIZE_MULT * s;
  const sx = cow.x*W, sy = cow.y*H;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(cow.facing, 1); // mirror when heading back right
  ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a1f14';
  ctx.fillText(E3, 0, 0);
  ctx.restore();
}

function drawCroc(){
  const s = scaleForY(croc.y);
  const size = Math.min(W,H) * COW_SIZE_MULT * s;
  const sx = croc.x*W, sy = croc.y*H;
  const dir = (player.x < croc.x) ? 1 : -1; // faces the player — default orientation faces left

  ctx.save();
  clipToTopFraction(sx, sy, size, 0.70); // always riding low in the water — bottom 30% cropped away
  ctx.translate(sx, sy);
  ctx.scale(dir, 1);
  ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a1f14';
  ctx.fillText(I3, 0, 0);
  ctx.restore();
}

function drawGameOver(){
  ctx.save();
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e9e4d8';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = (Math.min(W,H)*0.16).toFixed(1)+"px "+HIERO_FONT;
  ctx.fillText('𓂝𓈖𓂽', W/2, H/2);
  ctx.restore();
}

/* ---------- walk-cycle state ----------
   A1/A2 alternate on a fixed interval while moving; stopping
   always lands back on A1. */
const WALK_INTERVAL = 0.15 * 1.3; // 30% slower
const anim = { t:0, frame:0 };

function updateAnim(dt, moving){
  if(!moving){
    anim.t = 0;
    anim.frame = 0;
    return;
  }
  anim.t += dt;
  if(anim.t >= WALK_INTERVAL){
    anim.t = 0;
    anim.frame = anim.frame === 0 ? 1 : 0;
  }
}

function currentGlyph(){
  if(heldItem) return A9; // holding anything overrides the normal walk cycle
  return anim.frame === 0 ? A1 : A2;
}

/* ============================================================
   PLAYER — the current walk-cycle sign, sized off scaleForY(player.y).
   ============================================================ */
function drawPlayer(){
  const sx = player.x*W, sy = player.y*H;
  const s = scaleForY(player.y);
  const size = Math.min(W,H) * PLAYER_SIZE_MULT * s;
  const wading = !boarded && isInWater(player.x, player.y); // wading shows only the top 34% — chest-deep in the river, head always fully visible

  ctx.save();
  if(wading) clipHeadSafe(sx, sy, currentGlyph(), size, 0.34);
  ctx.translate(sx, sy);
  ctx.scale(facing, 1); // mirror when walking left so the sign faces the way it's moving
  ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a1f14';
  ctx.fillText(currentGlyph(), 0, 0);
  ctx.restore();

  if(heldItem){
    if(heldItem.kind === 'cow') drawCarriedCow(sx, sy, size);
    else if(heldItem.kind === 'boat') drawBoatOnHead(sx, sy, size);
    else if(heldItem.kind === 'level') drawHeldLevelObject(sx, sy, size);
  }
}

function drawHeldLevelObject(px, py, playerSize){
  const size = playerSize * heldItem.scale;
  const oy = py - playerSize*0.62;
  ctx.save();
  ctx.translate(px, oy);
  ctx.scale(heldItem.mirror ? -1 : 1, 1);
  ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = heldItem.golden ? '#b8860b' : '#2a1f14';
  ctx.fillText(heldItem.glyph, 0, 0);
  ctx.restore();
}

function drawCarriedCow(px, py, playerSize){
  // the cow riding upside-down on the player's head (no boat yet — that only appears after delivery)
  const cowSize = playerSize * 0.85;
  const cowY = py - playerSize*1.03; // midpoint between the original 1.15 offset and the touching-the-head 0.92 offset
  ctx.save();
  ctx.translate(px, cowY);
  ctx.scale(1, -1); // upside down
  ctx.font = cowSize.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a1f14';
  ctx.fillText(E3, 0, 0);
  ctx.restore();
}

function drawBoatOnHead(px, py, playerSize){
  // the reward: a boat balanced on the player's head once the cow is delivered and the npc's celebration is done.
  // (nothing is ever stacked on a worn item — cargo always comes off before the base itself can be lifted.)
  const boatSize = playerSize * 0.75;
  const boatY = py - playerSize*0.78; // raised further so it clears the top of the a9 pose's head entirely
  ctx.save();
  ctx.translate(px, boatY);
  ctx.font = boatSize.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a1f14';
  ctx.fillText(P1, 0, 0);
  ctx.restore();
}

function drawGroundBoat(){
  // the boat once dropped — sitting in the world at 200% larger than the size it was worn at
  if(!boatOnGround) return;
  const s = scaleForY(boatOnGround.y);
  const size = Math.min(W,H) * BOAT_SIZE_MULT * s * BOAT_DROP_SCALE;
  const sx = boatOnGround.x*W, sy = boatOnGround.y*H;
  const floating = isInWater(boatOnGround.x, boatOnGround.y); // sitting in the river shows only the top 70% — the hull rides low in the water

  ctx.save();
  if(floating) clipToTopFraction(sx, sy, size, 0.70);
  ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a1f14';
  ctx.fillText(P1, sx, sy);
  ctx.restore();

  drawStackedItems(boatOnGround.items, sx, sy, size);
}

// renders whatever's piled on top of a base (the boat, or a placed sign) —
// the cow rides upside-down (an old visual joke), any other sign sits
// right-side up, honoring its own mirror flag
function drawStackedItems(items, bx, by, baseSize){
  if(!items || !items.length) return;
  let y = by - baseSize*0.08;
  for(const it of items){
    if(it.kind === 'cow'){
      const s = baseSize * 0.55;
      ctx.save();
      ctx.translate(bx, y);
      ctx.scale(1, -1);
      ctx.font = s.toFixed(1)+'px '+HIERO_FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#2a1f14';
      ctx.fillText(E3, 0, 0);
      ctx.restore();
      y -= s*0.5;
    } else if(it.kind === 'level'){
      const s = baseSize * 0.55 * it.scale;
      ctx.save();
      ctx.translate(bx, y);
      ctx.scale(it.mirror ? -1 : 1, 1);
      ctx.font = s.toFixed(1)+'px '+HIERO_FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#2a1f14';
      ctx.fillText(it.glyph, 0, 0);
      ctx.restore();
      y -= s*0.5;
    }
  }
}

/* ---------- level-editor placed objects ---------- */
function drawLevelObject(obj, glyphOverride, mirrorOverride){
  const s = scaleForY(obj.y);
  const size = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * s * obj.scale;
  const sx = obj.x*W, sy = obj.y*H;
  const glyph = glyphOverride || obj.glyph;
  const mirror = mirrorOverride != null ? mirrorOverride : obj.mirror;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(mirror ? -1 : 1, 1);
  ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = obj.golden ? '#b8860b' : '#2a1f14'; // the lady's reward reads as gold, not ink
  ctx.fillText(glyph, 0, 0);
  ctx.restore();

  drawStackedItems(obj.items, sx, sy, size);

  if(!editMode) return;
  if(obj.id === selectedObjId){
    ctx.save();
    ctx.strokeStyle = '#b3392c';
    ctx.lineWidth = 2;
    ctx.setLineDash([4,4]);
    ctx.beginPath();
    ctx.arc(sx, sy, size*0.65, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  if(obj.pickup){
    ctx.save();
    ctx.fillStyle = '#2f7a3d';
    ctx.beginPath();
    ctx.arc(sx+size*0.32, sy-size*0.42, 4, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  if(obj.noHitbox){
    ctx.save();
    ctx.fillStyle = '#2b6ca3';
    ctx.beginPath();
    ctx.arc(sx-size*0.32, sy-size*0.42, 4, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

/* ============================================================
   INPUT / UPDATE
   ============================================================ */
const keys = {};
let spaceHeld = false;
window.addEventListener('keydown', e=>{
  const typing = document.activeElement && ['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
  if(typing) return; // let normal typing/editing happen in the panel's fields

  if(gameOver){
    // needs a deliberate, fresh press of Enter — not whatever arrow/space
    // key was still being held down at the moment you died (that was
    // instantly restarting the game via the browser's own key-repeat)
    if(e.key === 'Enter' && !e.repeat) location.reload();
    return;
  }

  keys[e.key.toLowerCase()] = true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
  if(e.key === ' ' && !spaceHeld){
    spaceHeld = true;
    onSpacePress();
  }
  if(e.key.toLowerCase() === 'e'){ setEditMode(!editMode); }
  if(editMode && (e.key === 'Delete' || e.key === 'Backspace') && selectedObjId !== null){
    e.preventDefault();
    deleteSelectedObject();
  }
}, {passive:false});
window.addEventListener('keyup', e=>{
  keys[e.key.toLowerCase()] = false;
  if(e.key === ' ') spaceHeld = false;
});
canvas.addEventListener('mousedown', ()=>{ if(gameOver) location.reload(); }); // "pressing" the game-over screen also restarts

/* ============================================================
   LEVEL EDITOR — DOM wiring. Movement/space are frozen while
   editMode is on; the canvas instead takes plain mouse clicks to
   place or select signs, and the side panel controls their size
   and pickupable flag.
   ============================================================ */
const editorPanel = document.getElementById('editor');
const paletteEl = document.getElementById('palette');
const scaleSlider = document.getElementById('scaleSlider');
const scaleValueEl = document.getElementById('scaleValue');
const pickupCheck = document.getElementById('pickupCheck');
const mirrorCheck = document.getElementById('mirrorCheck');
const noHitboxCheck = document.getElementById('noHitboxCheck');
const levelJsonEl = document.getElementById('levelJson');
const map1Btn = document.getElementById('map1Btn');
const mapNeg1Btn = document.getElementById('mapNeg1Btn');
function updateMapButtons(){
  map1Btn.disabled = currentMap === 1;
  mapNeg1Btn.disabled = currentMap === -1;
}
let showDebug = false;
const debugCheck = document.getElementById('debugCheck');
debugCheck.addEventListener('change', ()=>{ showDebug = debugCheck.checked; });

function setEditMode(on){
  editMode = on;
  editorPanel.hidden = !on;
  resize(); // the map's visible width changes to make room for the panel
}

// populate the palette with every sign in the Egyptian Hieroglyphs block
(function buildPalette(){
  for(let cp = 0x13000; cp <= 0x1342E; cp++){
    const glyph = String.fromCodePoint(cp);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'palette-btn';
    btn.textContent = glyph;
    btn.title = 'U+' + cp.toString(16).toUpperCase();
    if(glyph === placeGlyph) btn.classList.add('active');
    btn.addEventListener('click', ()=>{
      placeGlyph = glyph;
      paletteEl.querySelectorAll('.palette-btn.active').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
    paletteEl.appendChild(btn);
  }
})();

function refreshScaleLabel(v){ scaleValueEl.textContent = Number(v).toFixed(2)+'x'; }
refreshScaleLabel(scaleSlider.value);

scaleSlider.addEventListener('input', ()=>{
  const v = parseFloat(scaleSlider.value);
  refreshScaleLabel(v);
  const obj = levelObjects.find(o=>o.id===selectedObjId);
  if(obj) obj.scale = v; else placeScale = v;
});

pickupCheck.addEventListener('change', ()=>{
  const obj = levelObjects.find(o=>o.id===selectedObjId);
  if(obj) obj.pickup = pickupCheck.checked; else placePickup = pickupCheck.checked;
});

mirrorCheck.addEventListener('change', ()=>{
  const obj = levelObjects.find(o=>o.id===selectedObjId);
  if(obj) obj.mirror = mirrorCheck.checked; else placeMirror = mirrorCheck.checked;
});

noHitboxCheck.addEventListener('change', ()=>{
  const obj = levelObjects.find(o=>o.id===selectedObjId);
  if(obj) obj.noHitbox = noHitboxCheck.checked; else placeNoHitbox = noHitboxCheck.checked;
});

function selectObject(obj){
  selectedObjId = obj ? obj.id : null;
  if(obj){
    scaleSlider.value = obj.scale;
    refreshScaleLabel(obj.scale);
    pickupCheck.checked = obj.pickup;
    mirrorCheck.checked = !!obj.mirror;
    noHitboxCheck.checked = !!obj.noHitbox;
  }
}

function deleteSelectedObject(){
  const idx = levelObjects.findIndex(o=>o.id===selectedObjId);
  if(idx !== -1) levelObjects.splice(idx, 1);
  selectedObjId = null;
}
document.getElementById('deleteBtn').addEventListener('click', deleteSelectedObject);
map1Btn.addEventListener('click', ()=> setMap(1));
mapNeg1Btn.addEventListener('click', ()=> setMap(-1));
updateMapButtons();

document.getElementById('exportBtn').addEventListener('click', ()=>{
  levelJsonEl.value = JSON.stringify(levelObjects, null, 2);
});
function sanitizeStackItem(it){
  if(!it || typeof it !== 'object') return null;
  if(it.kind === 'cow') return { kind:'cow' };
  if(it.kind === 'level' && typeof it.glyph === 'string'){
    return { kind:'level', glyph:it.glyph, scale:it.scale||1, mirror:!!it.mirror, noHitbox:!!it.noHitbox, pickup:!!it.pickup };
  }
  return null;
}

document.getElementById('importBtn').addEventListener('click', ()=>{
  try{
    const data = JSON.parse(levelJsonEl.value);
    if(!Array.isArray(data)) throw new Error('expected an array');
    levelObjects.length = 0;
    let maxId = 0;
    data.forEach(o=>{
      if(typeof o.glyph !== 'string' || typeof o.x !== 'number' || typeof o.y !== 'number') return;
      const id = typeof o.id === 'number' ? o.id : nextObjId++;
      maxId = Math.max(maxId, id);
      const items = Array.isArray(o.items) ? o.items.map(sanitizeStackItem).filter(Boolean) : [];
      levelObjects.push({ id, glyph:o.glyph, x:o.x, y:o.y, scale:o.scale||1, pickup:!!o.pickup, mirror:!!o.mirror, noHitbox:!!o.noHitbox, items });
    });
    nextObjId = Math.max(nextObjId, maxId+1);
    selectedObjId = null;
  }catch(err){
    alert('Could not import: '+err.message);
  }
});

let draggingObj = null;

function hitTestObject(cx, cy){
  let hit = null, hitDist = Infinity;
  for(const obj of levelObjects){
    const s = scaleForY(obj.y);
    const size = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * s * obj.scale;
    const d = Math.hypot(cx-obj.x*W, cy-obj.y*H);
    if(d < size*0.65 && d < hitDist){ hit = obj; hitDist = d; }
  }
  return hit;
}

canvas.addEventListener('mousedown', e=>{
  if(!editMode) return;
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  const fx = cx/W, fy = cy/H;

  // hit-test existing objects first — closest one within its own radius wins
  const hit = hitTestObject(cx, cy);

  if(hit){
    selectObject(hit);
    draggingObj = hit; // held while the mouse is down — see the window-level listeners below
  } else {
    const obj = { id: nextObjId++, glyph: placeGlyph, x: fx, y: fy, scale: placeScale, pickup: placePickup, mirror: placeMirror, noHitbox: placeNoHitbox, items: [] };
    levelObjects.push(obj);
    selectObject(obj);
  }
});

window.addEventListener('mousemove', e=>{
  if(!editMode || !draggingObj) return;
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  draggingObj.x = Math.max(0, Math.min(1, cx/W));
  draggingObj.y = Math.max(0, Math.min(1, cy/H));
});
window.addEventListener('mouseup', ()=>{ draggingObj = null; });

/* ---------- collision ----------
   Nothing fancy: every solid is a circle in pixel space, sized off the
   same scaleForY() curve used to draw it, so "how big it looks" and
   "how big it blocks" always agree.

   For the walking figures (player/NPC/cow), the hitbox only covers the
   bottom 20% of the glyph — roughly its feet — instead of the whole
   sign. That's what lets a figure visually overlap something above its
   feet (an outstretched hand, another figure's head) while still only
   physically blocking when they're actually standing on the same spot. */
function feetHitbox(sx, sy, size, r){
  return { x:sx, y:sy+size*0.40, r };
}

function obstacleCircles(){
  const npcSize = Math.min(W,H) * NPC_SIZE_MULT * scaleForY(npc.y);
  const list = [
    feetHitbox(npc.x*W, npc.y*H, npcSize, npcSize*0.16),
  ];
  // skip the cow's hitbox while carried, and for a beat after being set
  // down (otherwise it'd trap the player who's standing right on it)
  if(!cow.carried && !cow.placed && cow.settleCooldown<=0){
    const cowSize = Math.min(W,H) * COW_SIZE_MULT * scaleForY(cow.y);
    list.push(feetHitbox(cow.x*W, cow.y*H, cowSize, cowSize*0.20));
  }
  // level-editor objects block movement by default — mark one "no hitbox" to let the player walk through it
  for(const obj of levelObjects){
    if(obj.noHitbox) continue;
    const size = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * scaleForY(obj.y) * obj.scale;
    list.push({ x: obj.x*W, y: obj.y*H, r: size*0.35 });
  }
  return list;
}
function collidesAt(fx, fy){
  const size = Math.min(W,H) * PLAYER_SIZE_MULT * scaleForY(fy);
  const foot = feetHitbox(fx*W, fy*H, size, size*0.16);
  return obstacleCircles().some(o => Math.hypot(foot.x-o.x, foot.y-o.y) < (o.r+foot.r));
}

/* ---------- river hazard: the crocodile ---------- */
// Drops a crocodile roughly SPAWN_DISTANCE_DIAMETERS player-widths from the
// player, somewhere inside the water. Tries a handful of compass directions
// first (cheap, and keeps it from spawning behind an obviously dry bank);
// if none of those land in the water, it falls back to whichever point on
// the river's own outline sits closest to the target distance.
function trySpawnCroc(){
  const size = Math.min(W,H) * PLAYER_SIZE_MULT * scaleForY(player.y);
  const distFrac = (size * 2 * SPAWN_DISTANCE_DIAMETERS) / Math.min(W,H);
  const angles = [0, Math.PI, 0.35, -0.35, Math.PI-0.35, Math.PI+0.35, Math.PI/2, -Math.PI/2];
  for(const a of angles){
    const cx = player.x + Math.cos(a)*distFrac;
    const cy = player.y + Math.sin(a)*distFrac;
    if(isInWater(cx, cy)){ croc = { x: cx, y: cy }; return; }
  }
  let best = null, bestDiff = Infinity;
  for(const p of WATER_POLY){
    const diff = Math.abs(Math.hypot(p[0]-player.x, p[1]-player.y) - distFrac);
    if(diff < bestDiff){ bestDiff = diff; best = p; }
  }
  if(best) croc = { x: best[0], y: best[1] };
}

function updateCroc(dt){
  if(!croc) return;

  // it'll go after whichever's in the water — the player on foot, or a
  // loose cow that got dropped in there — and loses interest once neither is
  const playerInWater = !boarded && isInWater(player.x, player.y);
  const cowInWater = !cow.carried && !cow.placed && isInWater(cow.x, cow.y);
  if(!playerInWater && !cowInWater){ croc = null; return; }

  let tx, ty, huntingCow;
  if(playerInWater && cowInWater){
    const dPlayer = Math.hypot(player.x-croc.x, player.y-croc.y);
    const dCow = Math.hypot(cow.x-croc.x, cow.y-croc.y);
    huntingCow = dCow < dPlayer;
  } else {
    huntingCow = cowInWater;
  }
  tx = huntingCow ? cow.x : player.x;
  ty = huntingCow ? cow.y : player.y;

  const depthFactor = scaleForY(croc.y);
  const speed = 0.30 * depthFactor * CROC_SPEED_MULT * dt;
  const dx = tx - croc.x, dy = ty - croc.y;
  const dist = Math.hypot(dx, dy);
  if(dist > 0.0001){
    croc.x += (dx/dist) * speed;
    croc.y += (dy/dist) * speed;
  }

  const size = Math.min(W,H) * COW_SIZE_MULT * depthFactor;
  const caughtDist = size * 0.5;
  const caught = Math.hypot((tx-croc.x)*W, (ty-croc.y)*H) < caughtDist;
  if(caught){
    // caught the cow or caught you — either way, it's game over
    gameOver = true;
  }
}

/* ---------- boat boarding ---------- */
// Walking into a parked boat's box while it's sitting in the water climbs
// aboard: from then on the boat itself is what moves, and the player (plus
// anything stacked on the boat) just rides along with it. The box itself
// only covers the boat's lower 15% — its hull, not the whole sail-height
// footprint — so you have to actually walk into the hull to trigger it.
// Carrying something in when you board doesn't block it: whatever's in
// heldItem is auto-dropped onto the boat's stack first, same as a manual drop.
function tryAutoBoard(){
  if(boarded || !boatOnGround || boardCooldown > 0) return;
  if(!isInWater(boatOnGround.x, boatOnGround.y)) return; // only a boat actually parked in the river can be boarded
  const s = scaleForY(boatOnGround.y);
  const boatSize = Math.min(W,H) * BOAT_SIZE_MULT * s * BOAT_DROP_SCALE;
  // the boat's actual collision line is the waterline along its bottom
  // edge — a thin strip spanning its width, not a circle over the hull.
  // The floating boat only shows its top 70% (drawGroundBoat clips it —
  // the hull rides low in the water), so that edge sits at +0.20*size.
  const hullY = boatOnGround.y*H + boatSize*0.20;
  const hullHalfWidth = boatSize*0.5;
  // the ship's own hull band is the entire hitbox — the character contributes
  // no radius of its own here, so this matches the debug overlay's magenta
  // box exactly rather than a padded-out version of it. This band is
  // deliberately much thicker than boatHitsObstacle's — walking down onto
  // the boat from the north means crossing this band vertically rather
  // than sliding along it, so it needs real depth to actually catch that
  // approach instead of being a hair-thin line you can step over in one
  // frame (that's what broke boarding from the north — the sailing band
  // it used to share with boatHitsObstacle is only 0.08, too thin to walk
  // into on purpose without a lot of luck).
  const boardBandHeight = boatSize*0.30;
  const dx = Math.abs(player.x*W - boatOnGround.x*W);
  const dy = Math.abs(player.y*H - hullY);
  if(dx < hullHalfWidth && dy < boardBandHeight){
    if(heldItem){
      const item = heldItem;
      heldItem = null;
      boatOnGround.items = boatOnGround.items || [];
      boatOnGround.items.push(item);
      settleDroppedItem(item, true);
    }
    boarded = true;
    // the player's safe aboard, but a crocodile already hunting a loose cow
    // left behind in the water keeps right on going
    wasInWater = false;
    player.x = boatOnGround.x;
    player.y = boatOnGround.y;
  }
}

// A few level objects with real hitboxes sit right in the river (reeds,
// stonework). The boat treats them like any other obstacle — hit one and
// it's run aground exactly as if it had hit the bank.
// There is no circular hitbox around the boat/rider — the sail, the oar,
// the character sitting up in it never register a hit. Only the hull band
// (the same waterline strip tryAutoBoard uses to board) can ever touch
// something, so an obstacle has to actually reach that thin strip along
// the boat's bottom edge, not just get close to the boat's visual size.
function boatHitsObstacle(x, y){
  const s = scaleForY(y);
  const boatSize = Math.min(W,H) * BOAT_SIZE_MULT * s * BOAT_DROP_SCALE;
  const hullY = y*H + boatSize*0.20;
  const hullHalfWidth = boatSize*0.5;
  const hullBandHeight = boatSize*0.08;
  const hullX = x*W;
  for(const obj of levelObjects){
    if(obj.noHitbox || !isInWater(obj.x, obj.y)) continue;
    const objR = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * scaleForY(obj.y) * obj.scale * 0.35;
    const ox = obj.x*W, oy = obj.y*H;
    // closest point on the hull band rectangle to the object's center
    const cx = Math.max(hullX-hullHalfWidth, Math.min(ox, hullX+hullHalfWidth));
    const cy = Math.max(hullY-hullBandHeight, Math.min(oy, hullY+hullBandHeight));
    if(Math.hypot(ox-cx, oy-cy) < objR) return true;
  }
  return false;
}

function updateBoardedMovement(dt){
  const depthFactor = scaleForY(boatOnGround.y);
  const speed = 0.30 * depthFactor * dt;
  let dx=0, dy=0;
  if(keys['arrowleft']||keys['a']) dx -= 1;
  if(keys['arrowright']||keys['d']) dx += 1;
  if(keys['arrowup']||keys['w']) dy -= 1;
  if(keys['arrowdown']||keys['s']) dy += 1;
  const moving = dx!==0 || dy!==0;
  if(dx > 0) facing = -1; else if(dx < 0) facing = 1;
  if(dx && dy){ dx *= 0.7071; dy *= 0.7071; }

  const targetX = boatOnGround.x + dx*speed;
  const targetY = boatOnGround.y + dy*speed;

  // sailing off the river's far west edge crosses into lvl -1, which has its
  // own real spawn point clear across that map — setMap(-1) already places
  // the boat there. Only pin it to the world edge on frames where you're
  // ALREADY in lvl -1 pushing further west (holding it like a wall); on the
  // very frame you first cross over, clobbering x back to BOUNDS.xMin right
  // after setMap moved it to MAP_NEG1_SPAWN would just undo that spawn.
  // The east edge (map 2) has no map or spawn built yet, so it still just
  // tracks/shows which "map" you're in and holds the boat at that edge.
  if(targetX <= BOUNDS.xMin){
    const alreadyThere = currentMap === -1;
    setMap(-1);
    if(alreadyThere) boatOnGround.x = BOUNDS.xMin;
  } else if(targetX >= BOUNDS.xMax){
    setMap(2);
    boatOnGround.x = BOUNDS.xMax;
  } else if(isInWater(targetX, targetY) && !boatHitsObstacle(targetX, targetY)){
    // the river is the rest of the world while aboard; running past its
    // north or south edge (or into an obstacle sitting in the water) means
    // the boat's run aground, so it's time to disembark
    setMap(1);
    boatOnGround.x = targetX;
    boatOnGround.y = targetY;
  } else {
    boarded = false;
    boardCooldown = 0.6;
  }
  player.x = boatOnGround.x;
  player.y = boatOnGround.y;
  updateAnim(dt, moving);
}

function update(dt){
  if(gameOver) return;
  if(boardCooldown > 0) boardCooldown = Math.max(0, boardCooldown - dt);

  if(boarded){
    updateBoardedMovement(dt);
    updateCroc(dt);
    return;
  }

  // the further back (deeper into the background) the player is, the
  // slower it covers ground — same depth curve used for the sprite scale.
  // wading through the river on foot (no boat) slows that further, to half pace.
  const depthFactor = scaleForY(player.y);
  const waterMult = isInWater(player.x, player.y) ? 0.5 : 1;
  const speed = 0.30 * depthFactor * waterMult * dt;

  let dx=0, dy=0;
  if(keys['arrowleft']||keys['a']) dx -= 1;
  if(keys['arrowright']||keys['d']) dx += 1;
  if(keys['arrowup']||keys['w']) dy -= 1;
  if(keys['arrowdown']||keys['s']) dy += 1;
  const moving = dx!==0 || dy!==0;

  // the sign's default orientation faces left, so only rightward
  // travel needs a mirror; leftward and purely-vertical movement keep
  // whatever facing was already set.
  if(dx > 0) facing = -1;
  else if(dx < 0) facing = 1;

  if(dx && dy){ dx *= 0.7071; dy *= 0.7071; } // even speed on the diagonal

  const targetX = Math.max(BOUNDS.xMin, Math.min(BOUNDS.xMax, player.x + dx*speed));
  const targetY = Math.max(BOUNDS.yMin, Math.min(BOUNDS.yMax, player.y + dy*speed));

  // axis-separated so the player slides along a solid instead of
  // just stopping dead when approaching it at an angle.
  if(!collidesAt(targetX, targetY)){
    player.x = targetX; player.y = targetY;
  } else if(!collidesAt(targetX, player.y)){
    player.x = targetX;
  } else if(!collidesAt(player.x, targetY)){
    player.y = targetY;
  }

  // the crocodile shows up the moment you wade in on foot; updateCroc()
  // itself handles losing interest once neither you nor a loose cow is
  // still in the water
  const nowWading = isInWater(player.x, player.y);
  if(nowWading && !wasInWater) trySpawnCroc();
  wasInWater = nowWading;
  updateCroc(dt);

  tryAutoBoard();

  updateAnim(dt, moving);
}

/* ============================================================
   RESIZE / RENDER LOOP
   ============================================================ */
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth - (editMode ? EDITOR_WIDTH : 0);
  H = window.innerHeight;
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  canvas.width = W*DPR;
  canvas.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

/* ============================================================
   DEBUG OVERLAY — toggled from the Level Editor panel ("Show
   hitboxes"). Draws exactly the numbers the collision code itself
   uses, so hitboxes can be checked by eye instead of by guesswork:
     cyan outline   — WATER_POLY (what isInWater() treats as river)
     orange circle  — an obstacle's hit radius (objR) for a sign
                       that's both !noHitbox AND currently in water
                       (a boat obstacle, per boatHitsObstacle)
     gray circle    — a !noHitbox sign that's NOT in water (still
                       blocks the player on foot, never the boat)
     magenta box    — tryAutoBoard's boarding/auto-drop band. Thick on
                       purpose — you walk INTO this one vertically.
     violet dashed box — boatHitsObstacle's sailing-collision band, along
                       the same waterline but hair-thin, so the boat still
                       slides past reeds/stonework instead of clipping them.
                       No circle around the boat or rider ever hits anything —
                       only these two bands can.
     aqua dashed box — nearestBase()'s reach for the boat's cargo stack:
                       E picks up/drops anywhere inside this (the boat's
                       full visible silhouette plus a bit of slop)
     green cross    — MAP_NEG1_SPAWN, the lvl -1 landing point
   ============================================================ */
function drawDebugOverlay(){
  if(!showDebug) return;
  ctx.save();

  // WATER_POLY and MAP1_OBJECTS are lvl 1's own fixed layout — they exist
  // whichever map is active, but only actually govern collision when
  // currentMap === 1 (see isInWater/boatHitsObstacle/obstacleCircles).
  // Drawing them on lvl -1 would show hitboxes for a river and reeds that
  // aren't there — lvl -1 is meant to be a blank map — so skip both.
  if(currentMap === 1){
    // water polygon
    ctx.beginPath();
    WATER_POLY.forEach((p,i)=>{
      const px = p[0]*W, py = p[1]*H;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    });
    ctx.closePath();
    ctx.strokeStyle = 'cyan';
    ctx.lineWidth = 2;
    ctx.stroke();

    // every !noHitbox sign in the main map — orange if it currently
    // counts as a boat obstacle, gray if it's a foot-only obstacle
    for(const obj of MAP1_OBJECTS){
      if(obj.noHitbox) continue;
      const objR = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * scaleForY(obj.y) * obj.scale * 0.35;
      const inWater = pointInPolygon(obj.x, obj.y, WATER_POLY);
      ctx.beginPath();
      ctx.arc(obj.x*W, obj.y*H, objR, 0, Math.PI*2);
      ctx.strokeStyle = inWater ? 'orange' : 'rgba(120,120,120,0.8)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  if(boatOnGround){
    const s = scaleForY(boatOnGround.y);
    const boatSize = Math.min(W,H) * BOAT_SIZE_MULT * s * BOAT_DROP_SCALE;
    const bx = boatOnGround.x*W, by = boatOnGround.y*H;

    // no circle around the sail/oar/rider ever registers a hit — only these
    // two hull-band rectangles can. They're deliberately different
    // thicknesses: boarding (magenta) needs real depth since you walk INTO
    // it vertically, especially coming down from the north; the sailing
    // obstacle band (violet, dashed) stays hair-thin so the boat still
    // slides past reeds/stonework easily instead of clipping on them.
    const hullY = by + boatSize*0.20;
    const hullHalfWidth = boatSize*0.5;
    const boardBandHeight = boatSize*0.30;
    const sailBandHeight = boatSize*0.08;
    ctx.strokeStyle = 'magenta';
    ctx.setLineDash([]);
    ctx.lineWidth = 2;
    ctx.strokeRect(bx-hullHalfWidth, hullY-boardBandHeight, hullHalfWidth*2, boardBandHeight*2);
    ctx.strokeStyle = 'violet';
    ctx.setLineDash([4,3]);
    ctx.lineWidth = 2;
    ctx.strokeRect(bx-hullHalfWidth, hullY-sailBandHeight, hullHalfWidth*2, sailBandHeight*2);
    ctx.setLineDash([]);

    // nearestBase()'s pick-from/drop-onto reach for the boat — same
    // boatCatchZone() it actually uses, so this can't drift out of sync
    const zone = boatCatchZone();
    ctx.strokeStyle = 'aqua';
    ctx.setLineDash([6,4]);
    ctx.lineWidth = 2;
    ctx.strokeRect(zone.bx-zone.halfW, zone.topY, zone.halfW*2, zone.botY-zone.topY);
    ctx.setLineDash([]);
  }

  // lvl -1 landing point, always shown for reference
  const sx = MAP_NEG1_SPAWN.x*W, sy = MAP_NEG1_SPAWN.y*H;
  ctx.strokeStyle = 'lime';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(sx-12, sy); ctx.lineTo(sx+12, sy);
  ctx.moveTo(sx, sy-12); ctx.lineTo(sx, sy+12);
  ctx.stroke();

  // the player's own on-foot hitbox (feetHitbox, used by collidesAt) —
  // drawn in red ONLY when it's actually live. update() returns before
  // ever calling collidesAt while boarded, so this circle disappears the
  // instant you climb aboard: while riding, only the yellow (boat) circle
  // above can register a hit. The on-screen label makes that state explicit
  // instead of asking you to take it on faith.
  ctx.font = '600 14px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  if(!boarded){
    const pSize = Math.min(W,H) * PLAYER_SIZE_MULT * scaleForY(player.y);
    const pFoot = feetHitbox(player.x*W, player.y*H, pSize, pSize*0.16);
    ctx.setLineDash([5,4]);
    ctx.beginPath();
    ctx.arc(pFoot.x, pFoot.y, pFoot.r, 0, Math.PI*2);
    ctx.strokeStyle = 'red';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'red';
    ctx.fillText('player hitbox: ON (on foot)', 14, 34);
  } else {
    ctx.fillStyle = 'lime';
    ctx.fillText('player hitbox: OFF (aboard — only the ship/yellow circle can hit)', 14, 34);
  }

  ctx.restore();
}

let t0 = performance.now();
function render(time){
  const dt = Math.min(0.05, (time-t0)/1000); t0 = time;
  if(!editMode && !gameOver){
    update(dt);
    if(currentMap === 1){
      updateCow(dt);
      updateNpcAnim(dt);
      updateDuck(dt);
    }
  }

  // lvl -1 (and any other non-main map) is a blank page — flat background,
  // no papyrus texture, no cow/npc/river/boat, just the character and
  // whatever's in heldItem (that always carries over, untouched by setMap)
  ctx.fillStyle = (currentMap === 1 && papyrusPattern) ? papyrusPattern : '#e9e4d8';
  ctx.fillRect(0,0,W,H);

  if(fontsReady){
    const dist = Math.hypot((player.x-npc.x)*W, (player.y-npc.y)*H);
    const nearNpc = dist < Math.min(W,H)*NPC_TALK_RANGE;

    // NPC/cow/level-objects draw back-to-front by depth among themselves;
    // the player always draws last, full opacity, on top of all of them —
    // he should always be visible, never hidden and never see-through.
    // A carried cow isn't part of that world anymore — it's drawn by
    // drawPlayer() itself, riding upside-down above his head.
    const drawList = [];
    if(currentMap === 1){
      drawList.push({ y: npc.y, draw: ()=>drawNpc(nearNpc) });
      if(!cow.carried && !cow.placed) drawList.push({ y: cow.y, draw: drawCow });
      if(croc) drawList.push({ y: croc.y, draw: drawCroc });
    }
    // the boat (and whatever's stacked on it) travels with you into lvl -1 —
    // only the cow/npc/crocodile/river are exclusive to the main map
    if(boatOnGround) drawList.push({ y: boatOnGround.y, draw: drawGroundBoat });
    for(const obj of levelObjects){
      if(obj === duckObj && duckFlying){
        const flapGlyph = duckAnimFrame === 0 ? G40 : G41;
        drawList.push({ y: obj.y, draw: ()=>drawLevelObject(obj, flapGlyph, true) });
      } else {
        drawList.push({ y: obj.y, draw: ()=>drawLevelObject(obj) });
      }
    }
    if(currentMap === 1 && ladyObj && !birdQuestDone){
      const distLady = Math.hypot((player.x-ladyObj.x)*W, (player.y-ladyObj.y)*H);
      if(distLady < Math.min(W,H)*LADY_TALK_RANGE){
        const ladySize = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * scaleForY(ladyObj.y) * ladyObj.scale;
        drawList.push({ y: ladyObj.y, draw: ()=>drawSpeechBubble(ladyObj.x*W, ladyObj.y*H-ladySize*0.75, LADY_QUEST_LINE, 22) });
      }
    }
    drawList.sort((a,b)=> a.y-b.y);
    drawList.forEach(e=>e.draw());
    drawPlayer();
    drawDebugOverlay();

    ctx.save();
    ctx.font = '600 16px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(42,31,20,0.8)';
    ctx.fillText('score '+score, W-14, 14);
    ctx.restore();

    // small corner marker so it's visible which map you're in
    if(currentMap !== 1){
      ctx.save();
      ctx.font = '600 16px system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillStyle = 'rgba(42,31,20,0.8)';
      ctx.fillText('lvl '+currentMap, 14, 14);
      ctx.restore();
    }

    if(gameOver) drawGameOver();
  }

  requestAnimationFrame(render);
}
requestAnimationFrame(render);

})();
</script>
