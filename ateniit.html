   its own, much slower, smaller-amplitude cycle than the horizontal one,
   so it reads as a shallow zigzag rather than an even diagonal bounce. */
const CAT_ZIG_SPAN = 6; // horizontal travel, in multiples of its own on-screen size
const CAT_ZIG_PERIOD = 4.5; // seconds per full horizontal back-and-forth
const CAT_ZAG_SPAN = 1.5; // vertical travel — deliberately much smaller than the horizontal span
const CAT_ZAG_PERIOD = 9; // seconds per full vertical up-and-down — slower than the horizontal leg
let catMoveT = 0;

// a straight-line ramp between -1 and +1 (sharp corner at each end) rather
// than a smooth curve — the actual shape of a zigzag turn
function triangleWave(t, period){
  const phase = (t % period) / period; // 0..1
  return phase < 0.5 ? (4*phase - 1) : (3 - 4*phase);
}

function updateCatMove(dt){
  if(currentMap !== 1 || !catObj) return;
  if(catObj._baseX === undefined){ catObj._baseX = catObj.x; catObj._baseY = catObj.y; }
  if(catSpeechT > 0){
    // frozen in place, "talking", while its fed reaction plays out — the
    // zigzag clock itself doesn't advance either, so it picks back up
    // exactly where it left off instead of jumping ahead
    catSpeechT = Math.max(0, catSpeechT - dt);
    return;
  }
  catMoveT += dt;
  // sized off its resting depth, not its currently-moving one, so the
  // zigzag doesn't feed back into its own amplitude as it paces up and down
  const size = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * scaleForY(catObj._baseY) * catObj.scale;
  const ampX = (size * CAT_ZIG_SPAN * 0.5) / W;
  const ampY = (size * CAT_ZAG_SPAN * 0.5) / H;
  const zigPhase = (catMoveT % CAT_ZIG_PERIOD) / CAT_ZIG_PERIOD;
  const zig = triangleWave(catMoveT, CAT_ZIG_PERIOD);
  const zag = triangleWave(catMoveT, CAT_ZAG_PERIOD);
  catObj.x = catObj._baseX + zig * ampX;
  // it's placed close enough to the very bottom of the world that even
  // this smaller vertical span could clip the bottom of the canvas at its
  // lowest point — clamped so it always stays on screen.
  catObj.y = Math.min(0.97, catObj._baseY + zag * ampY);
  catObj.mirror = zigPhase < 0.5; // faces whichever way it's currently moving — default glyph faces left
}

/* ---------- the woman (level object id 410) ----------
   Bring her 5 of the pickup snake signs scattered around lvl -1 and she
   hands back a golden N5 — same idea as the lady's bird quest on lvl 1. */
const WOMAN_ID = 410;
const WOMAN_TALK_RANGE = 0.24; // fraction of min(W,H) — matches the lady's/man's
const WOMAN_QUEST_LINE = '𓏎𓇋5𓎛𓆑𓄫𓅱𓆙';
const SNAKE_IDS = [332, 402, 403, 406, 409]; // the level's 5 pickup snake signs
const N5 = String.fromCodePoint(0x131F3); // sun disk (N5) — the woman's reward, rendered in gold
let snakesDelivered = 0;
let womanQuestDone = false;
const womanObj = MAP_NEG1_OBJECTS.find(o => o.id === WOMAN_ID) || null;

// called from tryDropHeldItem() — handing her one of the snakes while close
// enough consumes it instead of just setting it down; returns true if so
function tryGiveSnakeToWoman(item){
  if(currentMap !== -1 || womanQuestDone || !womanObj || item.kind !== 'level' || !SNAKE_IDS.includes(item.id)) return false;
  const dist = Math.hypot((player.x-womanObj.x)*W, (player.y-womanObj.y)*H);
  if(dist >= Math.min(W,H)*WOMAN_TALK_RANGE) return false;

  snakesDelivered++;
  if(snakesDelivered >= SNAKE_IDS.length){
    womanQuestDone = true;
    score += 5; // completing the delivery pays out once, on top of the golden N5
    // straight onto the player's head, worn like the boat — not left on the ground
    heldItem = { kind:'level', id: nextObjId++, glyph: N5, scale: 1, mirror: false, noHitbox: true, pickup: true, golden: true };
  }
  return true;
}

// called from tryDropHeldItem() — handing him a fish while close enough
// consumes it instead of just setting it down; returns true if so
function tryGiveFishToMan(item){
  if(currentMap !== -1 || manQuestDone || !manObj || item.kind !== 'level' || !FISH_IDS.includes(item.id)) return false;
  const dist = Math.hypot((player.x-manObj.x)*W, (player.y-manObj.y)*H);
  if(dist >= Math.min(W,H)*MAN_TALK_RANGE) return false;

  fishDelivered++;
  if(fishDelivered >= FISH_QUEST_TARGET){
    manQuestDone = true;
    startManCelebration(); // dance first — the walk-out only starts once that finishes
  }
  return true;
}

/* ---------- man delivery celebration ----------
   Same beat as the npc's cow-delivery dance (NPC_CELEBRATE_SEQUENCE /
   npcAnim above): play the sequence, then flip left/right five times,
   then — instead of granting a reward — kick off the walk out to the
   elephant. */
const manAnim = { phase:'idle', t:0, step:0, mirrors:0, facing:1 };

function startManCelebration(){
  manAnim.phase = 'sequence';
  manAnim.t = 0;
  manAnim.step = 0;
  manAnim.mirrors = 0;
  manAnim.facing = 1;
}

function updateManAnim(dt){
  if(manAnim.phase === 'idle') return;
  manAnim.t += dt;

  if(manAnim.phase === 'sequence'){
    if(manAnim.t >= NPC_STEP_TIME){
      manAnim.t = 0;
      manAnim.step++;
      if(manAnim.step >= NPC_CELEBRATE_SEQUENCE.length){
        manAnim.phase = 'mirroring';
      }
    }
  } else if(manAnim.phase === 'mirroring'){
    if(manAnim.t >= NPC_MIRROR_TIME){
      manAnim.t = 0;
      manAnim.facing *= -1;
      manAnim.mirrors++;
      if(manAnim.mirrors >= 5){
        manAnim.phase = 'idle';
        manAnim.facing = 1;
        // dance's done — now he actually sets off to confront the elephant,
        // wherever it happens to be right now (asleep at home or mid-chase)
        const targetX = elephant ? elephant.x : manObj.x;
        const targetY = elephant ? elephant.y : manObj.y;
        manWalk = { phase:'out', t:0, fromX: manObj.x, fromY: manObj.y, toX: targetX, toY: targetY };
      }
    }
  }
}

function manGlyph(){
  if(manAnim.phase === 'sequence') return NPC_CELEBRATE_SEQUENCE[manAnim.step];
  if(manAnim.phase === 'mirroring') return A29; // mirror A29 itself, not the whole sequence
  return manObj.glyph;
}

function drawManCelebrating(){
  if(!manObj) return;
  const depthFactor = scaleForY(manObj.y);
  const size = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * depthFactor * manObj.scale;

  ctx.save();
  ctx.translate(manObj.x*W, manObj.y*H);
  ctx.scale(manAnim.facing, 1);
  ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a1f14';
  ctx.fillText(manGlyph(), 0, 0);
  ctx.restore();
}

function updateManWalk(dt){
  if(!manWalk) return;
  manWalk.t += dt;
  if(manWalk.t >= MAN_WALK_DURATION){
    if(manWalk.phase === 'out'){
      elephant = null;
      elephantGoneForGood = true; // only for the rest of this visit — see setMap(-1)
      manWalk = { phase:'back', t:0, fromX: manWalk.toX, fromY: manWalk.toY, toX: manObj.x, toY: manObj.y };
    } else {
      manWalk = null; // home safe — back to being drawn as a normal static sign
    }
  }
}

function manWalkPos(){
  const t = Math.min(1, manWalk.t / MAN_WALK_DURATION);
  return {
    x: manWalk.fromX + (manWalk.toX - manWalk.fromX) * t,
    y: manWalk.fromY + (manWalk.toY - manWalk.fromY) * t,
  };
}

function drawManWalking(){
  if(!manWalk || !manObj) return;
  const { x, y } = manWalkPos();
  const depthFactor = scaleForY(y);
  const size = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * depthFactor * manObj.scale;
  const dir = (manWalk.toX < x) ? 1 : -1; // faces whichever way this leg is walking

  ctx.save();
  ctx.translate(x*W, y*H);
  ctx.scale(dir, 1);
  ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a1f14';
  ctx.fillText(manObj.glyph, 0, 0);
  ctx.restore();
}

/* ---------- boat boarding ---------- */
// Walking into a parked boat's box while it's sitting in the water climbs
// aboard: from then on the boat itself is what moves, and the player (plus
// anything stacked on the boat) just rides along with it. The box itself
// only covers the boat's lower 15% — its hull, not the whole sail-height
// footprint — so you have to actually walk into the hull to trigger it.
// Carrying something in when you board doesn't block it: whatever's in
// heldItem is auto-dropped onto the boat's stack first, same as a manual drop.
function tryAutoBoard(){
  if(boarded || !boatOnGround || boardCooldown > 0) return;
  if(!isInWater(boatOnGround.x, boatOnGround.y)) return; // only a boat actually parked in the river can be boarded
  const s = scaleForY(boatOnGround.y);
  const boatSize = Math.min(W,H) * BOAT_SIZE_MULT * s * BOAT_DROP_SCALE;
  // the boat's actual collision line is the waterline along its bottom
  // edge — a thin strip spanning its width, not a circle over the hull.
  // The floating boat only shows its top 70% (drawGroundBoat clips it —
  // the hull rides low in the water), so that edge sits at +0.20*size.
  const hullY = boatOnGround.y*H + boatSize*0.20;
  const hullHalfWidth = boatSize*0.5;
  // the ship's own hull band is the entire hitbox — the character contributes
  // no radius of its own here, so this matches the debug overlay's magenta
  // box exactly rather than a padded-out version of it. This band is
  // deliberately much thicker than boatHitsObstacle's — walking down onto
  // the boat from the north means crossing this band vertically rather
  // than sliding along it, so it needs real depth to actually catch that
  // approach instead of being a hair-thin line you can step over in one
  // frame (that's what broke boarding from the north — the sailing band
  // it used to share with boatHitsObstacle is only 0.08, too thin to walk
  // into on purpose without a lot of luck).
  const boardBandHeight = boatSize*0.30;
  const dx = Math.abs(player.x*W - boatOnGround.x*W);
  const dy = Math.abs(player.y*H - hullY);
  if(dx < hullHalfWidth && dy < boardBandHeight){
    if(heldItem){
      const item = heldItem;
      heldItem = null;
      boatOnGround.items = boatOnGround.items || [];
      boatOnGround.items.push(item);
      settleDroppedItem(item, true);
    }
    boarded = true;
    // the player's safe aboard, but a crocodile already hunting a loose cow
    // left behind in the water keeps right on going
    wasInWater = false;
    player.x = boatOnGround.x;
    player.y = boatOnGround.y;
  }
}

// A few level objects with real hitboxes sit right in the river (reeds,
// stonework). The boat treats them like any other obstacle — hit one and
// it's run aground exactly as if it had hit the bank.
// There is no circular hitbox around the boat/rider — the sail, the oar,
// the character sitting up in it never register a hit. Only the hull band
// (the same waterline strip tryAutoBoard uses to board) can ever touch
// something, so an obstacle has to actually reach that thin strip along
// the boat's bottom edge, not just get close to the boat's visual size.
function boatHitsObstacle(x, y){
  const s = scaleForY(y);
  const boatSize = Math.min(W,H) * BOAT_SIZE_MULT * s * BOAT_DROP_SCALE;
  const hullY = y*H + boatSize*0.20;
  const hullHalfWidth = boatSize*0.5;
  const hullBandHeight = boatSize*0.08;
  const hullX = x*W;
  for(const obj of levelObjects){
    if(obj.noHitbox || !isInWater(obj.x, obj.y)) continue;
    const objR = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * scaleForY(obj.y) * obj.scale * 0.35;
    const ox = obj.x*W, oy = obj.y*H;
    // closest point on the hull band rectangle to the object's center
    const cx = Math.max(hullX-hullHalfWidth, Math.min(ox, hullX+hullHalfWidth));
    const cy = Math.max(hullY-hullBandHeight, Math.min(oy, hullY+hullBandHeight));
    if(Math.hypot(ox-cx, oy-cy) < objR) return true;
  }
  return false;
}

// Attempts to move the boat to (tx,ty); returns true and applies the move
// (or the map transition) if it's allowed, false if it isn't. Kept separate
// from updateBoardedMovement so that function can retry along a single axis
// instead of the whole diagonal step.
function tryMoveBoatTo(tx, ty){
  // The world runs lvl -1 (west) <-> lvl 1 (middle) <-> lvl 2 (east), all
  // sharing the same 0..1 BOUNDS, so crossing BOUNDS.xMin always means "go
  // one map west" and BOUNDS.xMax always means "go one map east" — except
  // at the two outer edges (lvl -1's own west wall, lvl 2's own east wall),
  // which just hold the boat like a wall since there's nothing further out.
  // Each map's own river doesn't line up in y with its neighbor's, so every
  // crossing lands on a real, known-good water point near that map's near
  // edge (its own *_SPAWN constant) rather than just carrying whatever y you
  // had, which could easily land you on dry ground instead of afloat.
  // Only pin the boat to the world edge on frames where you're ALREADY on
  // the map at that outer wall, pushing further into it (holding it like a
  // wall) — on the very frame you first cross into a new map, clobbering x
  // back to the edge right after setMap moved it to that map's spawn would
  // just undo the spawn.
  if(tx <= BOUNDS.xMin){
    if(currentMap === -1){
      boatOnGround.x = BOUNDS.xMin; // lvl -1's own west wall — nothing further out
    } else if(currentMap === 2){
      setMap(1);
      boatOnGround.x = MAP1_EAST_SPAWN.x;
      boatOnGround.y = MAP1_EAST_SPAWN.y;
    } else {
      setMap(-1); // already places the boat at MAP_NEG1_SPAWN
    }
    return true;
  } else if(tx >= BOUNDS.xMax){
    if(currentMap === 2){
      boatOnGround.x = BOUNDS.xMax; // lvl 2's own east wall — nothing further out
    } else if(currentMap === -1){
      setMap(1);
      boatOnGround.x = MAP1_WEST_SPAWN.x;
      boatOnGround.y = MAP1_WEST_SPAWN.y;
    } else {
      setMap(2); // already places the boat at MAP2_WEST_SPAWN
    }
    return true;
  } else if(isInWater(tx, ty) && !boatHitsObstacle(tx, ty)){
    // just sailing within whichever map's river is already active — no map
    // transition here, that's what the two edge branches above are for
    boatOnGround.x = tx;
    boatOnGround.y = ty;
    return true;
  }
  return false;
}

function updateBoardedMovement(dt){
  const depthFactor = scaleForY(boatOnGround.y);
  const speed = 0.30 * depthFactor * dt;
  let dx=0, dy=0;
  if(keys['arrowleft']||keys['a']) dx -= 1;
  if(keys['arrowright']||keys['d']) dx += 1;
  if(keys['arrowup']||keys['w']) dy -= 1;
  if(keys['arrowdown']||keys['s']) dy += 1;
  if(dx===0 && dy===0){
    // no key held — fall back to steering toward a tapped spot, if any.
    // touchMoveDir() already returns a unit vector, so skip the 0.7071
    // diagonal correction below for this case (nothing to correct).
    const dir = touchMoveDir(boatOnGround.x, boatOnGround.y);
    if(dir){ dx = dir.dx; dy = dir.dy; }
  }
  const moving = dx!==0 || dy!==0;
  if(dx > 0) facing = -1; else if(dx < 0) facing = 1;
  // the hull keeps its own heading, only ever touched from in here — see
  // drawGroundBoat, which reads this instead of the shared `facing` var, so
  // an empty boat left on the bank doesn't keep spinning around to match
  // wherever the player (now on foot, updating `facing` for their own walk
  // cycle) happens to be walking.
  boatOnGround.facing = facing;
  if((keys['arrowleft']||keys['a']||keys['arrowright']||keys['d']) && (keys['arrowup']||keys['w']||keys['arrowdown']||keys['s'])){ dx *= 0.7071; dy *= 0.7071; }

  const targetX = boatOnGround.x + dx*speed;
  const targetY = boatOnGround.y + dy*speed;

  // axis-separated, same as the on-foot movement below: a diagonal step
  // that's blocked (river bank, obstacle) first falls back to sliding along
  // whichever single axis is still clear, so cutting a corner along the
  // bank doesn't run the boat aground. The axis-only fallbacks only make
  // sense — and are only tried — when the input is actually diagonal
  // (dx && dy): for a straight approach there's no "other axis" to slide
  // along, and re-checking the boat's own unchanged position (targetY ===
  // boatOnGround.y when dy is 0, or the x equivalent) would trivially
  // "succeed" against water it's already sitting in, silently swallowing
  // every straight run at the bank instead of ever beaching the boat.
  let moved = tryMoveBoatTo(targetX, targetY);
  if(!moved && dx && dy){
    moved = tryMoveBoatTo(targetX, boatOnGround.y) || tryMoveBoatTo(boatOnGround.x, targetY);
  }
  if(!moved && moving){
    // the river is the rest of the world while aboard; running past its
    // north or south edge (or into an obstacle sitting in the water), with
    // no clear axis to slide along either, means the boat's run aground, so
    // it's time to disembark
    boarded = false;
    boardCooldown = 0.6;
  }
  player.x = boatOnGround.x;
  player.y = boatOnGround.y;
  updateAnim(dt, moving);
}

function update(dt){
  if(gameOver) return;
  if(birdAttack){ updateBirdAttack(dt); return; } // frozen mid-dive until the kick lands
  if(boardCooldown > 0) boardCooldown = Math.max(0, boardCooldown - dt);

  if(boarded){
    updateBoardedMovement(dt);
    updateCroc(dt);
    updateElephant(dt);
    updateManAnim(dt);
    updateManWalk(dt);
    updateFishJump(dt);
    updateFishSwim(dt);
    updateCatMove(dt);
    updateHippoSway(dt);
    updateSunGuardian(dt);
    return;
  }

  // the further back (deeper into the background) the player is, the
  // slower it covers ground — same depth curve used for the sprite scale.
  // wading through the river on foot (no boat) slows that further, to half pace.
  const depthFactor = scaleForY(player.y);
  const waterMult = isInWater(player.x, player.y) ? 0.5 : 1;
  const speed = 0.30 * depthFactor * waterMult * dt;

  let dx=0, dy=0;
  if(keys['arrowleft']||keys['a']) dx -= 1;
  if(keys['arrowright']||keys['d']) dx += 1;
  if(keys['arrowup']||keys['w']) dy -= 1;
  if(keys['arrowdown']||keys['s']) dy += 1;
  const keyHeld = dx!==0 || dy!==0;
  if(!keyHeld){
    // no key held — fall back to walking toward a tapped spot, if any.
    // touchMoveDir() already returns a unit vector, so it skips the
    // 0.7071 diagonal correction below (nothing to correct there).
    const dir = touchMoveDir(player.x, player.y);
    if(dir){ dx = dir.dx; dy = dir.dy; }
  }
  const moving = dx!==0 || dy!==0;

  // the sign's default orientation faces left, so only rightward
  // travel needs a mirror; leftward and purely-vertical movement keep
  // whatever facing was already set.
  if(dx > 0) facing = -1;
  else if(dx < 0) facing = 1;

  if(keyHeld && dx && dy){ dx *= 0.7071; dy *= 0.7071; } // even speed on the diagonal, keys only

  const targetX = Math.max(BOUNDS.xMin, Math.min(BOUNDS.xMax, player.x + dx*speed));
  const targetY = Math.max(BOUNDS.yMin, Math.min(BOUNDS.yMax, player.y + dy*speed));

  // axis-separated so the player slides along a solid instead of
  // just stopping dead when approaching it at an angle.
  if(!collidesAt(targetX, targetY)){
    player.x = targetX; player.y = targetY;
  } else if(!collidesAt(targetX, player.y)){
    player.x = targetX;
  } else if(!collidesAt(player.x, targetY)){
    player.y = targetY;
  }

  // the crocodile shows up the moment you wade in on foot; updateCroc()
  // itself handles losing interest once neither you nor a loose cow is
  // still in the water
  const nowWading = isInWater(player.x, player.y);
  if(nowWading && !wasInWater) trySpawnCroc();
  wasInWater = nowWading;
  updateCroc(dt);
  updateElephant(dt);
  updateManAnim(dt);
  updateManWalk(dt);
  updateFishJump(dt);
  updateFishSwim(dt);
  updateCatMove(dt);
  updateHippoSway(dt);
  updateSunGuardian(dt);

  // the reed staircase's guardian bird — stepping onto it without the stick
  // triggers one dive per approach; already carrying the stick is safe
  const inYellowZoneUnequipped = currentMap === -1 && !hasStick() && isInLandPocket(player.x, player.y);
  if(inYellowZoneUnequipped && !wasInYellowZoneUnequipped) triggerBirdAmbush();
  wasInYellowZoneUnequipped = inYellowZoneUnequipped;

  tryAutoBoard();

  updateAnim(dt, moving);
}

/* ============================================================
   RESIZE / RENDER LOOP
   ============================================================ */
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  // W always tracks the full window width, editor open or not — see the
  // #gameWrap comment above for why it no longer shrinks by EDITOR_WIDTH here.
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  canvas.width = W*DPR;
  canvas.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

/* ============================================================
   DEBUG OVERLAY — toggled from the Level Editor panel ("Show
   hitboxes"). Draws exactly the numbers the collision code itself
   uses, so hitboxes can be checked by eye instead of by guesswork:
     cyan outline   — the active map's river polygon (what isInWater() treats as river)
     orange circle  — an obstacle's hit radius (objR) for a sign
                       that's both !noHitbox AND currently in water
                       (a boat obstacle, per boatHitsObstacle)
     gray circle    — a !noHitbox sign that's NOT in water (still
                       blocks the player on foot, never the boat)
     magenta box    — tryAutoBoard's boarding/auto-drop band. Thick on
                       purpose — you walk INTO this one vertically.
     violet dashed box — boatHitsObstacle's sailing-collision band, along
                       the same waterline but hair-thin, so the boat still
                       slides past reeds/stonework instead of clipping them.
                       No circle around the boat or rider ever hits anything —
                       only these two bands can.
     aqua dashed box — nearestBase()'s reach for the boat's cargo stack:
                       E picks up/drops anywhere inside this (the boat's
                       full visible silhouette plus a bit of slop)
     green cross    — MAP_NEG1_SPAWN, the lvl -1 landing point
   ============================================================ */
function drawDebugOverlay(){
  if(!showDebug) return;
  ctx.save();

  // whichever map is active, drawn with its own river polygon and its own
  // object list — lvl 2 has neither yet, so both are skipped there.
  const activePoly = activeWaterPoly();
  if(activePoly){
    // water polygon
    ctx.beginPath();
    activePoly.forEach((p,i)=>{
      const px = p[0]*W, py = p[1]*H;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    });
    ctx.closePath();
    ctx.strokeStyle = 'cyan';
    ctx.lineWidth = 2;
    ctx.stroke();

    // every !noHitbox sign in the active map — orange if it currently
    // counts as a boat obstacle (boatHitsObstacle's own centered radius,
    // unchanged), gray if it's a foot-only obstacle (obstacleCircles' bottom-
    // quarter footprint circle, see the comment there)
    for(const obj of levelObjects){
      if(obj.noHitbox) continue;
      const size = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * scaleForY(obj.y) * obj.scale;
      const inWater = pointInPolygon(obj.x, obj.y, activePoly);
      ctx.beginPath();
      if(inWater){
        ctx.arc(obj.x*W, obj.y*H, size*0.35, 0, Math.PI*2);
      } else {
        ctx.ellipse(obj.x*W, obj.y*H + size*0.375, size*0.45, size*0.125, 0, 0, Math.PI*2);
      }
      ctx.strokeStyle = inWater ? 'orange' : 'rgba(120,120,120,0.8)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  if(boatOnGround){
    const s = scaleForY(boatOnGround.y);
    const boatSize = Math.min(W,H) * BOAT_SIZE_MULT * s * BOAT_DROP_SCALE;
    const bx = boatOnGround.x*W, by = boatOnGround.y*H;

    // no circle around the sail/oar/rider ever registers a hit — only these
    // two hull-band rectangles can. They're deliberately different
    // thicknesses: boarding (magenta) needs real depth since you walk INTO
    // it vertically, especially coming down from the north; the sailing
    // obstacle band (violet, dashed) stays hair-thin so the boat still
    // slides past reeds/stonework easily instead of clipping on them.
    const hullY = by + boatSize*0.20;
    const hullHalfWidth = boatSize*0.5;
    const boardBandHeight = boatSize*0.30;
    const sailBandHeight = boatSize*0.08;
    ctx.strokeStyle = 'magenta';
    ctx.setLineDash([]);
    ctx.lineWidth = 2;
    ctx.strokeRect(bx-hullHalfWidth, hullY-boardBandHeight, hullHalfWidth*2, boardBandHeight*2);
    ctx.strokeStyle = 'violet';
    ctx.setLineDash([4,3]);
    ctx.lineWidth = 2;
    ctx.strokeRect(bx-hullHalfWidth, hullY-sailBandHeight, hullHalfWidth*2, sailBandHeight*2);
    ctx.setLineDash([]);

    // nearestBase()'s pick-from/drop-onto reach for the boat — same
    // boatCatchZone() it actually uses, so this can't drift out of sync
    const zone = boatCatchZone();
    ctx.strokeStyle = 'aqua';
    ctx.setLineDash([6,4]);
    ctx.lineWidth = 2;
    ctx.strokeRect(zone.bx-zone.halfW, zone.topY, zone.halfW*2, zone.botY-zone.topY);
    ctx.setLineDash([]);
  }

  // lvl -1 landing point, always shown for reference
  const sx = MAP_NEG1_SPAWN.x*W, sy = MAP_NEG1_SPAWN.y*H;
  ctx.strokeStyle = 'lime';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(sx-12, sy); ctx.lineTo(sx+12, sy);
  ctx.moveTo(sx, sy-12); ctx.lineTo(sx, sy+12);
  ctx.stroke();

  // the player's own on-foot hitbox (feetHitbox, used by collidesAt) —
  // drawn in red ONLY when it's actually live. update() returns before
  // ever calling collidesAt while boarded, so this circle disappears the
  // instant you climb aboard: while riding, only the yellow (boat) circle
  // above can register a hit. The on-screen label makes that state explicit
  // instead of asking you to take it on faith.
  ctx.font = '600 14px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  if(!boarded){
    const pSize = Math.min(W,H) * PLAYER_SIZE_MULT * scaleForY(player.y);
    const pFoot = feetHitbox(player.x*W, player.y*H, pSize, pSize*0.16);
    ctx.setLineDash([5,4]);
    ctx.beginPath();
    ctx.arc(pFoot.x, pFoot.y, pFoot.r, 0, Math.PI*2);
    ctx.strokeStyle = 'red';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'red';
    ctx.fillText('player hitbox: ON (on foot)', 14, 34);
  } else {
    ctx.fillStyle = 'lime';
    ctx.fillText('player hitbox: OFF (aboard — only the ship/yellow circle can hit)', 14, 34);
  }

  ctx.restore();
}

let t0 = performance.now();
function render(time){
  const dt = Math.min(0.05, (time-t0)/1000); t0 = time;
  if(!editMode && !gameOver){
    update(dt);
    if(currentMap === 1){
      updateCow(dt);
      updateNpcAnim(dt);
      updateDuck(dt);
    }
  }

  // every map shares the same papyrus texture as its default background —
  // lvl -1 (and any other non-main map) is still otherwise blank: no
  // cow/npc/river/boat, just the character and whatever's in heldItem
  // (that always carries over, untouched by setMap)
  ctx.fillStyle = papyrusPattern || '#e9e4d8';
  ctx.fillRect(0,0,W,H);

  if(fontsReady){
    const dist = Math.hypot((player.x-npc.x)*W, (player.y-npc.y)*H);
    const nearNpc = dist < Math.min(W,H)*NPC_TALK_RANGE;

    // NPC/cow/level-objects draw back-to-front by depth among themselves;
    // the player always draws last, full opacity, on top of all of them —
    // he should always be visible, never hidden and never see-through.
    // A carried cow isn't part of that world anymore — it's drawn by
    // drawPlayer() itself, riding upside-down above his head.
    const drawList = [];
    if(currentMap === 1){
      drawList.push({ y: npc.y, draw: ()=>drawNpc(nearNpc) });
    }
    // the cow can be carried onto the boat and sailed anywhere, so — unlike
    // the npc, who never leaves lvl 1 — it has to stay visible (and pickable
    // right where it visibly sits) on whichever map it actually gets set
    // down on, not just lvl 1. It used to only draw here on lvl 1, which
    // made a cow dropped on lvl -1 turn invisible while still being
    // perfectly pickable — same bug class the crocodile/hippo comment below
    // already solved for itself. But dropping the lvl-1-only gate entirely
    // meant the cow's lvl-1 x/y — the same numbers it's always had, since it
    // starts life resting on lvl 1 — landed inside lvl -1's own normalized
    // space too, so it showed up there right from the start of a session
    // even though it was never actually carried over. cow.map (set only
    // when it's actually dropped somewhere, see settleDroppedItem) is what
    // actually tracks which map it belongs on.
    if(!cow.carried && !cow.placed && cow.map === currentMap) drawList.push({ y: cow.y, draw: drawCow });
    // the crocodile/hippo hazard now follows whichever map has a river, so
    // it draws outside the lvl-1-only block above
    if(croc) drawList.push({ y: croc.y, draw: drawCroc });
    // the elephant (lvl -1 only) is drawn dynamically from its own moving
    // position once awake, or its placed one while still asleep — either
    // way it's excluded from the static per-object loop just below
    if(elephant && currentMap === -1) drawList.push({ y: elephant.y, draw: drawElephant });
    // the man dances in place the moment the 2nd fish is delivered, then
    // walks out to confront the elephant and back again — dynamically
    // positioned/drawn throughout, same idea as the elephant above
    if(manWalk) drawList.push({ y: manWalkPos().y, draw: drawManWalking });
    else if(manAnim.phase !== 'idle') drawList.push({ y: manObj.y, draw: drawManCelebrating });
    // the boat (and whatever's stacked on it) travels with you into lvl -1 —
    // only the cow/npc are exclusive to the main map
    if(boatOnGround) drawList.push({ y: boatOnGround.y, draw: drawGroundBoat });
    for(const obj of levelObjects){
      if(obj.id === ELEPHANT_OBJ_ID) continue; // drawn dynamically above instead
      if(obj.id === MAN_ID && (manWalk || manAnim.phase !== 'idle')) continue; // mid-walk or mid-dance — drawn dynamically above instead
      if(obj === duckObj && duckFlying){
        const flapGlyph = duckAnimFrame === 0 ? G40 : G41;
        drawList.push({ y: obj.y, draw: ()=>drawLevelObject(obj, flapGlyph, true) });
      } else {
        // opaque (solid-backing) items are the one kind that's allowed to
        // actually hide the player, see the sort/split below — everything
        // else stays exempt from it, same as before.
        drawList.push({ y: obj.y, opaque: obj.opaque === true, draw: ()=>drawLevelObject(obj) });
      }
    }
    if(currentMap === 1 && ladyObj && !birdQuestDone){
      const distLady = Math.hypot((player.x-ladyObj.x)*W, (player.y-ladyObj.y)*H);
      if(distLady < Math.min(W,H)*LADY_TALK_RANGE){
        const ladySize = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * scaleForY(ladyObj.y) * ladyObj.scale;
        drawList.push({ y: ladyObj.y, draw: ()=>drawSpeechBubble(ladyObj.x*W, ladyObj.y*H-ladySize*0.75, LADY_QUEST_LINE, 22) });
      }
    }
    if(currentMap === -1 && manObj && !manQuestDone && !manWalk){
      const distMan = Math.hypot((player.x-manObj.x)*W, (player.y-manObj.y)*H);
      if(distMan < Math.min(W,H)*MAN_TALK_RANGE){
        const manSize = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * scaleForY(manObj.y) * manObj.scale;
        drawList.push({ y: manObj.y, draw: ()=>drawSpeechBubble(manObj.x*W, manObj.y*H-manSize*0.75, MAN_QUEST_LINE, 22) });
      }
    }
    if(currentMap === -1 && womanObj && !womanQuestDone){
      const distWoman = Math.hypot((player.x-womanObj.x)*W, (player.y-womanObj.y)*H);
      if(distWoman < Math.min(W,H)*WOMAN_TALK_RANGE){
        const womanSize = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * scaleForY(womanObj.y) * womanObj.scale;
        drawList.push({ y: womanObj.y, draw: ()=>drawSpeechBubble(womanObj.x*W, womanObj.y*H-womanSize*0.75, WOMAN_QUEST_LINE, 22) });
      }
    }
    if(currentMap === 1 && catObj && catSpeechT > 0){
      const catSize = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * scaleForY(catObj.y) * catObj.scale;
      drawList.push({ y: catObj.y, draw: ()=>drawSpeechBubble(catObj.x*W, catObj.y*H-catSize*0.75, CAT_SPEECH_LINE, 22) });
    }
    // Almost everything here draws behind the player no matter its own y —
    // the player is meant to always read as the thing you're controlling,
    // never accidentally hidden behind an ordinary sign or npc. The one
    // exception is a level object with "solid backing" (opaque:true, see the
    // editor's "Solid backing" checkbox and drawLevelObject's backing-plate
    // comment): those represent actual architecture (doorframes, walls) that
    // should be able to hide you when you're standing behind them, so any
    // opaque item whose own y puts it further toward the camera than the
    // player (obj.y > player.y) draws AFTER the player instead, occluding
    // him with its backing plate exactly like it already occludes whatever
    // else is drawn behind it in the z-order.
    const behindPlayer = [], occludingPlayer = [];
    for(const e of drawList){
      if(e.opaque && e.y > player.y) occludingPlayer.push(e);
      else behindPlayer.push(e);
    }
    behindPlayer.sort((a,b)=> a.y-b.y);
    behindPlayer.forEach(e=>e.draw());
    drawPlayer();
    occludingPlayer.sort((a,b)=> a.y-b.y);
    occludingPlayer.forEach(e=>e.draw());
    drawBirdAttack();
    drawFishJump();
    drawSunGuardian();
    drawDebugOverlay();

    ctx.save();
    ctx.font = '600 16px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(42,31,20,0.8)';
    ctx.fillText('score '+score, W-14, 14);
    ctx.restore();

    // small corner marker so it's visible which map you're in
    if(currentMap !== 1){
      ctx.save();
      ctx.font = '600 16px system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillStyle = 'rgba(42,31,20,0.8)';
      ctx.fillText('lvl '+currentMap, 14, 14);
      ctx.restore();
    }

    if(gameOver) drawGameOver();
  }

  requestAnimationFrame(render);
}
initElephant();

// coming back from a death-triggered reload (see respawnAfterDeath()) —
// land on whichever level you died on instead of always lvl 1
try{
  const respawnMap = sessionStorage.getItem(RESPAWN_MAP_KEY);
  if(respawnMap !== null){
    sessionStorage.removeItem(RESPAWN_MAP_KEY);
    const mapId = parseInt(respawnMap, 10);
    if(!Number.isNaN(mapId)) setMap(mapId);
  }
}catch(e){}

requestAnimationFrame(render);

})();
</script>
</body>
</html>
