<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depth Walk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Egyptian+Hieroglyphs&display=swap">
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#e9e4d8; }
  canvas { display:block; touch-action:none; }

  /* The canvas itself never resizes just because the editor opened — it stays
     the same full width it always was, so nothing on the map gets squished
     into a different aspect ratio while you're trying to place things
     precisely. #gameWrap is what shrinks to make room for the panel, and it
     gets a horizontal scrollbar so the far side of the map is still reachable. */
  #gameWrap { position:fixed; top:0; left:0; width:100%; height:100%; overflow:hidden; }
  #gameWrap.editing { width:calc(100% - 440px); overflow-x:auto; overflow-y:hidden; }

  #editor {
    position:fixed; top:0; right:0; width:440px; height:100%; box-sizing:border-box;
    background:#fdf8ec; border-left:1px solid rgba(40,30,20,0.25);
    font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#2a1f14; padding:18px; overflow-y:auto;
  }
  #editor[hidden] { display:none; }
  #editor h2 { font-size:17px; margin:0 0 6px; }
  #editor .hint { font-size:12px; color:#6b5a45; margin:0 0 14px; }
  #editor label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:0.04em; color:#6b5a45; margin:14px 0 5px; }
  #palette {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(34px, 1fr)); gap:4px;
    max-height:44vh; overflow-y:auto; border:1px solid rgba(40,30,20,0.2);
    padding:5px; background:#fff;
  }
  .palette-btn {
    font-family: "Noto Sans Egyptian Hieroglyphs"; font-size:22px;
    width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    background:#fdf8ec; border:1px solid rgba(40,30,20,0.15); border-radius:3px; cursor:pointer;
  }
  .palette-btn:hover { background:#f0e7d2; }
  .palette-btn.active { background:#e3b98c; border-color:#a06a2e; }
  .sliderRow { display:flex; align-items:center; gap:8px; }
  .sliderRow input[type=range] { flex:1; }
  #scaleValue { font-variant-numeric: tabular-nums; min-width:2.6em; text-align:right; }
  .row { display:flex; align-items:center; gap:6px; margin-top:8px; }
  #editor button {
    font: inherit; padding:6px 10px; border:1px solid #a06a2e; background:#e3b98c;
    color:#2a1f14; border-radius:4px; cursor:pointer; margin-top:8px; margin-right:6px;
  }
  #editor button:hover { background:#d9ab74; }
  #editor button:disabled { opacity:0.55; cursor:default; }
  #editor textarea {
    width:100%; box-sizing:border-box; height:90px; margin-top:6px; font:11px/1.3 monospace;
  }
</style>
</head>
<body>
<div id="gameWrap"><canvas id="game"></canvas></div>
<div id="editor" hidden>
  <h2>Level Editor</h2>
  <p class="hint">Press E to close. Click the map to place the selected sign, click a placed sign to select it, then drag it to move it. Del removes the selection.</p>
  <label>Sign palette</label>
  <div id="palette"></div>
  <label>Size</label>
  <div class="sliderRow">
    <input type="range" id="scaleSlider" min="0.3" max="3" step="0.05" value="1">
    <span id="scaleValue">1.00x</span>
  </div>
  <label>Reveal (crops the bottom away — for burying things under the map)</label>
  <div class="sliderRow">
    <input type="range" id="revealSlider" min="0.1" max="1" step="0.05" value="1">
    <span id="revealValue">100%</span>
  </div>
  <div class="row">
    <input type="checkbox" id="pickupCheck">
    <label style="margin:0; text-transform:none; letter-spacing:0; font-size:13px;" for="pickupCheck">Pickupable</label>
  </div>
  <div class="row">
    <input type="checkbox" id="mirrorCheck">
    <label style="margin:0; text-transform:none; letter-spacing:0; font-size:13px;" for="mirrorCheck">Mirrored (face right)</label>
  </div>
  <div class="row">
    <input type="checkbox" id="noHitboxCheck">
    <label style="margin:0; text-transform:none; letter-spacing:0; font-size:13px;" for="noHitboxCheck">No hitbox (walk through)</label>
  </div>
  <div class="row">
    <input type="checkbox" id="opaqueCheck">
    <label style="margin:0; text-transform:none; letter-spacing:0; font-size:13px;" for="opaqueCheck">Solid backing (blocks what's behind it)</label>
  </div>
  <div>
    <button id="deleteBtn">Delete selected</button>
  </div>
  <label>Map</label>
  <div>
    <button id="map1Btn">Lvl 1</button>
    <button id="mapNeg1Btn">Lvl -1</button>
    <button id="map2Btn">Lvl 2</button>
  </div>
  <div class="row">
    <input type="checkbox" id="debugCheck">
    <label style="margin:0; text-transform:none; letter-spacing:0; font-size:13px;" for="debugCheck">Show hitboxes</label>
  </div>
  <label>Level data</label>
  <div>
    <button id="exportBtn">Export</button>
    <button id="importBtn">Import</button>
  </div>
  <textarea id="levelJson" placeholder="Exported JSON appears here — paste JSON here and click Import to load it."></textarea>
</div>
<script>
(function(){
"use strict";

/* ============================================================
   DEPTH WALK — motion only, no scenery.
   Arrow keys / WASD move the player, which alternates between
   Gardiner A1 and A2 while moving, and rests on A1 when still.
   Moving up shrinks it toward the background; moving down
   grows it toward the foreground. Three fixed depth anchors
   shape the scale curve.
   ============================================================ */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const HIERO_FONT = '"Noto Sans Egyptian Hieroglyphs"';
const A1 = String.fromCodePoint(0x13000); // seated man — idle / walk frame 1

const E3 = String.fromCodePoint(0x130D4); // cow
const A9 = String.fromCodePoint(0x1300B); // player, while carrying the cow
const P1 = String.fromCodePoint(0x1329B); // boat — carried on the player's head under the cow
const A28 = String.fromCodePoint(0x13020); // NPC delivery-celebration sequence
const A29 = String.fromCodePoint(0x13021);
const A31 = String.fromCodePoint(0x13023);

const G40 = String.fromCodePoint(0x1316E); // duck flying — wingbeat frame 1

Promise.all([
  document.fonts.load('100px '+HIERO_FONT),

/* ---------- depth anchors ----------
   y is a fraction of canvas height (0 = top/far, 1 = bottom/near).
   Scale is interpolated linearly between the two anchors the
   player currently sits between. */
const DEPTH_ANCHORS = [
  [0.10, 0.35],   // background
  [0.40, 0.58],   // background -> midground seam
  [0.72, 0.88],   // midground -> foreground seam
  [0.96, 1.35],   // foreground
];
function scaleForY(y){
  for(let i=0; i<DEPTH_ANCHORS.length-1; i++){
    const [y0,s0] = DEPTH_ANCHORS[i], [y1,s1] = DEPTH_ANCHORS[i+1];
    if(y>=y0 && y<=y1){
      const t = (y-y0)/(y1-y0);
      return s0 + (s1-s0)*t;
    }
  }
  return y < DEPTH_ANCHORS[0][0] ? DEPTH_ANCHORS[0][1] : DEPTH_ANCHORS[DEPTH_ANCHORS.length-1][1];
}

function pointInPolygon(x, y, poly){
  let inside = false;
  for(let i=0, j=poly.length-1; i<poly.length; j=i++){
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    const intersect = ((yi>y) !== (yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi);
    if(intersect) inside = !inside;
  }

}
function isInWater(x, y){
  const poly = activeWaterPoly();
  if(!poly) return false; // no river outside a map that has one
  if(currentMap === -1 && isInLandPocket(x, y)) return false; // a raised bank the hand-traced river polygon still technically covers
  return pointInPolygon(x, y, poly);
}
const BOAT_WATER_SNAP = 0.14; // fraction of min(W,H) — how close a boat drop needs to be to the river to snap into it
// Finds the closest point in (or on the edge of) the active map's river to
// (x,y) — used to snap a dropped boat into the water even if it lands a bit
// short, since the river band is thin enough that hitting it exactly
// (especially approaching from the south) is fiddly.
function nearestWaterPoint(x, y){
  if(isInWater(x, y)) return [x, y];
  const poly = activeWaterPoly();
  if(!poly) return [x, y];
  let best = null, bestDist = Infinity;
  for(let i=0, j=poly.length-1; i<poly.length; j=i++){
    const ax=poly[j][0], ay=poly[j][1], bx=poly[i][0], by=poly[i][1];
    const dx=bx-ax, dy=by-ay;
    const lenSq = dx*dx+dy*dy;
    let t = lenSq>0 ? ((x-ax)*dx+(y-ay)*dy)/lenSq : 0;
    t = Math.max(0, Math.min(1, t));
    const nx = ax+t*dx, ny = ay+t*dy;
    const d = Math.hypot(nx-x, ny-y);
    if(d < bestDist){ bestDist = d; best = [nx, ny]; }
  }
  // step a hair past the bank, into the water's own interior, so it reads
  // as floating rather than balanced right on the edge
  const dx = best[0]-x, dy = best[1]-y;
  const len = Math.hypot(dx,dy) || 1;
  const nudged = [best[0] + (dx/len)*0.01, best[1] + (dy/len)*0.01];
  return isInWater(nudged[0], nudged[1]) ? nudged : best;
}
// The plain box-based crop used for anything floating/submerged (the boat,
// the crocodile): shows the top `frac` of the glyph's nominal size box.
function clipToTopFraction(cx, cy, size, frac){
  ctx.beginPath();
  ctx.rect(cx-size, cy-size*0.5, size*2, size*frac);
  ctx.clip();
}
// Same idea for the player wading, but pinned so the head can never be cut
// off: hieroglyph glyphs don't sit centered in their nominal box the way
// Latin letters do, so a plain box crop was chopping heads off some of
// them. This measures the glyph's actual drawn ink and, if it turns out to
// reach higher than the box assumed, extends the window up to cover it —
// the crop window only ever grows upward from the box default, never
// shrinks, so it can't introduce the opposite problem (over-cropping).
function clipHeadSafe(cx, cy, glyph, size, frac){
  ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  const m = ctx.measureText(glyph);
  const boxTop = cy - size*0.5;
  const inkTop = cy - m.actualBoundingBoxAscent;
  const top = Math.min(boxTop, inkTop);
  ctx.beginPath();
  ctx.rect(cx-size, top, size*2, size*frac);
  ctx.clip();
}

function findKickLandingSpot(x, y){
  for(let r = 0.02; r <= 0.6; r += 0.02){

  const bx = birdAttack.fromX + (birdAttack.toX - birdAttack.fromX) * eased;

/* ---------- lvl -1 ambient scene: the guardian bird catches a jumping fish ----------
   Purely decorative — get close to the reed staircase and a fish leaps out
   of the water trying to hop across it; the same bird that dive-bombs the
   player for crossing without the stick preys on the wildlife too, and
   snatches it clean out of the air partway through the jump, then flies off
   with its catch. Never touches the player, held items, or quest state —
   just replays every time you approach again (after a short cooldown). */
const FISH_SPOT = { x: 0.545, y: 0.34 }; // roughly the middle of the staircase
const FISH_SPOT_RANGE = 0.30; // fraction of min(W,H) — how close triggers it
const FISH_JUMP_FROM = { x: 0.485, y: 0.365 }; // water at the near/south side of the staircase
const FISH_JUMP_TO = { x: 0.615, y: 0.345 }; // water on the far side — it never actually gets there
const FISH_JUMP_DIR = FISH_JUMP_TO.x < FISH_JUMP_FROM.x ? 1 : -1; // default glyph orientation faces left
const FISH_ARC_HEIGHT = 0.13; // how high above that line the leap rises at its peak
const FISH_SWIM_TIME = 0.9; // bobbing in the water before it commits to the jump
const FISH_CATCH_FRACTION = 0.62; // how far across the jump it gets before the bird hits
const FISH_JUMP_TIME = 0.85; // full hypothetical jump — it's only ever airborne for FISH_CATCH_FRACTION of this
const BIRD_DIVE_TIME = 0.35; // the bird's stoop onto the fish, from off above
const BIRD_CARRY_TIME = 0.55; // flying off with its catch afterward
const FISH_JUMP_COOLDOWN = 3.5; // seconds after finishing before it can trigger again
let fishJump = null; // { phase:'swim'|'jump'|'strike'|'carry', t, catchX, catchY, diveFromX, diveFromY, carryToX, carryToY }
let wasNearFishSpot = false;
let fishJumpCooldownT = 0;

function fishArcPos(s){ // s: 0..1 fraction across the full hypothetical jump
  const x = FISH_JUMP_FROM.x + (FISH_JUMP_TO.x - FISH_JUMP_FROM.x) * s;
  const baseY = FISH_JUMP_FROM.y + (FISH_JUMP_TO.y - FISH_JUMP_FROM.y) * s;
  const y = baseY - FISH_ARC_HEIGHT * 4 * s * (1 - s); // parabolic hump, zero at both ends
  return { x, y };
}

function triggerFishJump(){
  fishJump = { phase:'swim', t:0 };
}

function updateFishJump(dt){
  if(fishJumpCooldownT > 0) fishJumpCooldownT = Math.max(0, fishJumpCooldownT - dt);
  if(currentMap !== -1){ fishJump = null; return; }

  if(!fishJump){
    const dist = Math.hypot((player.x-FISH_SPOT.x)*W, (player.y-FISH_SPOT.y)*H);
    const near = dist < Math.min(W,H)*FISH_SPOT_RANGE;
    if(near && !wasNearFishSpot && fishJumpCooldownT <= 0) triggerFishJump();
    wasNearFishSpot = near;
    return;
  }

  fishJump.t += dt;
  if(fishJump.phase === 'swim'){
    if(fishJump.t >= FISH_SWIM_TIME){
      fishJump.phase = 'jump';
      fishJump.t = 0;
    }
  } else if(fishJump.phase === 'jump'){
    const catchDuration = FISH_JUMP_TIME * FISH_CATCH_FRACTION;
    if(fishJump.t >= catchDuration){
      const { x, y } = fishArcPos(FISH_CATCH_FRACTION);
      fishJump.catchX = x;
      fishJump.catchY = y;
      fishJump.diveFromX = x - 0.10; // the bird drops in from above
      fishJump.diveFromY = y - 0.32;
      fishJump.carryToX = x + 0.22; // then flies off and away with its catch
      fishJump.carryToY = y - 0.30;
      fishJump.phase = 'strike';
      fishJump.t = 0;
    }
  } else if(fishJump.phase === 'strike'){
    if(fishJump.t >= BIRD_DIVE_TIME){
      fishJump.phase = 'carry';
      fishJump.t = 0;
    }
  } else if(fishJump.phase === 'carry'){
    if(fishJump.t >= BIRD_CARRY_TIME){
      fishJump = null;
      fishJumpCooldownT = FISH_JUMP_COOLDOWN;
    }
  }
}

function drawFishJump(){
  if(!fishJump) return;
  const s = fishJump.phase === 'swim' ? 0
    : fishJump.phase === 'jump' ? FISH_CATCH_FRACTION * Math.min(1, fishJump.t / (FISH_JUMP_TIME * FISH_CATCH_FRACTION))
    : null; // null once caught — the bird's own path takes over

  if(s !== null){
    // still just a fish, swimming in place or mid-leap on its own
    const pos = fishJump.phase === 'swim'
      ? { x: FISH_JUMP_FROM.x, y: FISH_JUMP_FROM.y + Math.sin(fishJump.t*6)*0.01 }
      : fishArcPos(s);
    const depthFactor = scaleForY(pos.y);
    const size = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * depthFactor * 0.4;
    ctx.save();
    ctx.translate(pos.x*W, pos.y*H);
    ctx.scale(FISH_JUMP_DIR, 1);
    ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#2a1f14';
    ctx.fillText(K3, 0, 0);
    ctx.restore();
    return;
  }

  // caught — the bird carries it from here, fish drawn just below/behind
  let bx, by, dir;
  if(fishJump.phase === 'strike'){
    const t = Math.min(1, fishJump.t / BIRD_DIVE_TIME);
    const eased = t*t; // accelerating stoop
    bx = fishJump.diveFromX + (fishJump.catchX - fishJump.diveFromX) * eased;
    by = fishJump.diveFromY + (fishJump.catchY - fishJump.diveFromY) * eased;
    dir = fishJump.catchX < fishJump.diveFromX ? 1 : -1;
  } else {
    const t = Math.min(1, fishJump.t / BIRD_CARRY_TIME);
    const eased = t*(2-t); // eases out
    bx = fishJump.catchX + (fishJump.carryToX - fishJump.catchX) * eased;
    by = fishJump.catchY + (fishJump.carryToY - fishJump.catchY) * eased;
    dir = fishJump.carryToX < fishJump.catchX ? 1 : -1;
  }
  const depthFactor = scaleForY(by);
  const fishSize = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * depthFactor * 0.4;
  const birdSize = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * depthFactor * BIRD_SCALE;

  ctx.save();
  ctx.translate(bx*W, by*H + fishSize*0.35);
  ctx.font = (fishSize*0.8).toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a1f14';
  ctx.fillText(K3, 0, 0);
  ctx.restore();

  ctx.save();
  ctx.translate(bx*W, by*H);
  ctx.scale(dir, 1);
  ctx.font = birdSize.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a1f14';
  ctx.fillText(G24, 0, 0);
  ctx.restore();
}

    // stacked on it) rides in right along with you, wherever it was.
    // lvl -1 is only ever reached by boat, and a death-respawn could
    // otherwise drop you here on foot right next to its hazards, so a boat

    player.x = MAP_NEG1_SPAWN.x;

    // starts the fish-delivery quest over too — whether that's a
    // death-respawn or just sailing back in after having already run the
    // elephant off, none of it carries over from a previous visit
    elephantGoneForGood = false;
    fishDelivered = 0;
    manQuestDone = false;
    manWalk = null;
    snakesDelivered = 0;
    womanQuestDone = false;
    initElephant();
  }
  if(mapId === 2){
    // lvl 2 is reached by boat off lvl 1's east edge, but it's also reachable
    // straight from the level editor's own "Lvl 2" button — either way, land
    // already aboard a boat sitting right on the water's west-bank spawn
    // point, the same guarantee lvl -1's own spawn makes above.
    player.x = MAP2_WEST_SPAWN.x;
    player.y = MAP2_WEST_SPAWN.y;
    boatOnGround = { x: MAP2_WEST_SPAWN.x, y: MAP2_WEST_SPAWN.y, items: boatOnGround ? boatOnGround.items : [] };
    boarded = true;
    boardCooldown = 0;
  }

  // way — same idea as the fish-jump scene above
  sunGuardian = null;
  updateMapButtons();
}

  {"id":522,"glyph":"𓉶","x":0.7780494770026023,"y":0.4827586206896552,"scale":1.35,"reveal":1,"pickup":false,"mirror":false,"noHitbox":false,"opaque":true,"items":[]},
  {"id":523,"glyph":"𓉶","x":0.768125,"y":0.5108853410740203,"scale":1.35,"reveal":1,"pickup":false,"mirror":false,"noHitbox":false,"opaque":false,"items":[]},
  {"id":526,"glyph":"𓃠","x":0.869375,"y":0.4876632801161103,"scale":0.5,"reveal":1,"pickup":true,"mirror":false,"noHitbox":false,"opaque":false,"items":[]}
]; // baked-in starting layout for "lvl 2", pasted in via the level editor's Export
let levelObjects = MAP1_OBJECTS; // active object list for whichever map is currently loaded
let nextObjId = 527; // past the highest id placed on any map (the sun/snakes/grapes/woman at 400-410 on lvl -1, the cat at 411 on lvl 1, lvl 2's own layout at 426-526)
let selectedObjId = null;
let placeGlyph = A1;   // currently chosen palette sign, for the next placement
let placeScale = 1;    // currently chosen size, for the next placement
let placeReveal = 1;   // currently chosen reveal fraction, for the next placement
let placePickup = false;
let placeMirror = false;
let placeNoHitbox = false;
let placeOpaque = false;
const EDITOR_WIDTH = 440; // must match #editor's / #gameWrap.editing's CSS width
const LEVEL_OBJ_BASE_MULT = PLAYER_SIZE_MULT; // scale 1 reads roughly player-sized at the same depth

/* ---------- the duck (level object id 119) ----------
   A resting G039 sitting duck that spooks and flies off — up and off to
   whichever side the player isn't approaching from — once you get close,
   flapping between G040/G041 the whole way until it's off the map. */
const DUCK_ID = 119;
const DUCK_APPROACH_RANGE = 0.22; // fraction of min(W,H) — how close startles it
const DUCK_FLAP_INTERVAL = 0.12;  // seconds per wingbeat
const DUCK_FLY_SPEED = 0.16;      // fraction of canvas per second
let duckObj = levelObjects.find(o => o.id === DUCK_ID) || null;
let duckFlying = false;
let duckVX = 0, duckVY = 0;
let duckAnimT = 0, duckAnimFrame = 0;

function updateDuck(dt){
  if(!duckObj) return; // never existed, or already flew off for good

  if(!duckFlying){
    const dist = Math.hypot((player.x-duckObj.x)*W, (player.y-duckObj.y)*H);
    if(dist < Math.min(W,H)*DUCK_APPROACH_RANGE){
      duckFlying = true;
      const sideDir = (player.x <= duckObj.x) ? 1 : -1; // away from the approaching player
      duckVX = DUCK_FLY_SPEED * 0.55 * sideDir;
      duckVY = -DUCK_FLY_SPEED; // up — scaleForY shrinks it as it climbs, like receding into the distance
      duckAnimT = 0; duckAnimFrame = 0;
    }
    return;
  }

  duckObj.x += duckVX * dt;
  duckObj.y += duckVY * dt;

  duckAnimT += dt;
  if(duckAnimT >= DUCK_FLAP_INTERVAL){
    duckAnimT = 0;
    duckAnimFrame = duckAnimFrame === 0 ? 1 : 0;
  }

  // gone for good once it's flown off the map
  if(duckObj.x < -0.08 || duckObj.x > 1.08 || duckObj.y < -0.08){
    const idx = levelObjects.indexOf(duckObj);
    if(idx !== -1) levelObjects.splice(idx, 1);
    duckObj = null;
    duckFlying = false;
  }
}

/* ---------- the lady (level object id 115) ----------
   Sits between the harp and the archway. Bring her 5 of the pickup birds
   already scattered around the level (each a different sign) and she
   hands back a golden N6. */
const LADY_ID = 115;
const BIRD_IDS = [6, 152, 155, 157, 158]; // the level's 5 pickup-bird signs
const LADY_TALK_RANGE = 0.24; // fraction of min(W,H) — matches the main npc's
const LADY_QUEST_LINE = '𓅠𓅓𓏛𓏤5𓄿𓊪𓂧𓅯';
let birdsDelivered = 0;
let birdQuestDone = false;
const ladyObj = levelObjects.find(o => o.id === LADY_ID) || null;

// called from tryDropHeldItem() — handing her one of the birds while close
// enough consumes it instead of just setting it down; returns true if so
function tryGiveBirdToLady(item){
  if(currentMap !== 1 || birdQuestDone || !ladyObj || item.kind !== 'level' || !BIRD_IDS.includes(item.id)) return false;
  const dist = Math.hypot((player.x-ladyObj.x)*W, (player.y-ladyObj.y)*H);
  if(dist >= Math.min(W,H)*LADY_TALK_RANGE) return false;

  birdsDelivered++;
  if(birdsDelivered >= BIRD_IDS.length){
    birdQuestDone = true;
    // straight onto the player's head, worn like the boat — not left on the ground
    heldItem = { kind:'level', id: nextObjId++, glyph: N6, scale: 1, mirror: false, noHitbox: true, pickup: true, golden: true };
  }
  return true;
}

/* ============================================================
   NPC — with a speech bubble that only shows once the player is
   close enough to "hear" him.
   ============================================================ */
const npc = {
  x:0.60, y:0.85, // foreground
  line:'𓅠𓅓𓏛𓏏𓄿𓇋𓎛𓏏𓃒𓏤', // "the cow is in the field, go find it and bring it to me"
  lineWithCow:'𓅯𓄿𓇋𓏏𓂋𓏲𓈗𓂻𓂋𓅯𓄿𓊖𓏏𓏤' // shown instead, once he sees you're bringing the cow
};

/* ---------- cow ----------
   Rests at its base spot. Once the player gets close it drifts slowly
   two of its own widths to the left, stops, then drifts back — mirroring
   the moment it turns to head back to the right. */
const cow = {
  x:0.16, y:0.52, baseX:0.16, baseY:0.52, // midground, off to the left
  state:'idle', pauseT:0, facing:1, carried:false, placed:false, settleCooldown:0,
  map:1 // which map it's actually resting on — starts home on lvl 1, and only
        // ever changes when it's carried off and set down somewhere else in
        // THIS session (see settleDroppedItem). Without this it would draw
        // at its lvl-1 coordinates on lvl -1 too, even if it was never
        // brought there — same x/y numbers happen to fall inside both maps'
        // normalized 0..1 space, so nothing else told the two apart.
};
const COW_APPROACH_RANGE = 0.30; // fraction of min(W,H) — how close triggers the drift
const COW_MOVE_SPEED = 0.045;    // fraction of canvas width per second — slow
const COW_PAUSE = 0.7;           // seconds paused at the far-left point

function onSpacePress(){
  if(editMode) return; // editing has its own click-based controls
  if(boarded) return; // hands are busy steering — can't pick up or drop while aboard
  if(heldItem){ tryDropHeldItem(); return; }
  tryPickup();
}

// the boat's pick-from/drop-onto reach — used by both nearestBase() and the
// debug overlay, so the two can never drift apart the way earlier hitboxes did.
// Sized directly off a reference screenshot where the boat's own size was
// measured against a hand-drawn circle showing exactly how far out picking
// things out of the ship should reach: about 1.45x the boat's size to
// either side, 0.5x above it (already clears the masthead) and a full 1.2x
// below it — reaching well past the hull into where you'd actually be
// standing on the bank or wading up to it. All as fractions of boatSize
// (not flat pixels), so it scales correctly at any depth/window size, with
// a small flat floor under each just so a boat far enough away to be
// nearly a dot doesn't shrink its own reach away to nothing.
function boatCatchZone(){
  const s = scaleForY(boatOnGround.y);
  const boatSize = Math.min(W,H) * BOAT_SIZE_MULT * s * BOAT_DROP_SCALE;
  const bx = boatOnGround.x*W, by = boatOnGround.y*H;
  const floor = Math.min(W,H) * 0.05;
  const halfW = Math.max(boatSize*1.45, floor);
  const topY = by - Math.max(boatSize*1.0, floor); // doubled — the northern (upward) reach needed twice the room
  const botY = by + Math.max(boatSize*1.2, floor*1.2);
  return { bx, by, halfW, topY, botY };
}

// the nearest thing in the world that can be stacked onto, or lifted from —
// the boat (once it's on the ground) and every placed sign
function nearestBase(){
  let best = null, bestKind = null, bestDist = Infinity;
  if(boatOnGround){
    const { bx, by, halfW, topY, botY } = boatCatchZone();
    const px = player.x*W, py = player.y*H;
    if(px > bx-halfW && px < bx+halfW && py > topY && py < botY){
      const d = Math.hypot(px-bx, py-by);
      if(d < bestDist){ best = boatOnGround; bestKind = 'boat'; bestDist = d; }
    }
  }
  for(const obj of levelObjects){
    // purely decorative signs (river ripples, reeds, background clutter)
    // are neither pickupable nor ever carry a stack — they have nothing to
    // offer here. Letting them compete for "nearest" was the actual bug
    // behind the boat feeling unreachable: the river is littered with these
    // right next to where the boat sits, so one of them was almost always
    // closer to the player than the boat's own center, silently winning
    // the comparison below and blocking the boat entirely — no matter how
    // wide its own catch zone was made.
    if(!obj.pickup && !(obj.items && obj.items.length)) continue;
    const d = Math.hypot((player.x-obj.x)*W, (player.y-obj.y)*H);
    if(d < Math.min(W,H)*CAPTURE_RANGE && d < bestDist){ best = obj; bestKind = 'level'; bestDist = d; }
  }
  return best ? { base:best, kind:bestKind } : null;
}

/* ---------- lvl -1: the sun disk is guarded ----------
   Pick up the sun (object 400) and its guardian — C1, the falcon-headed sun
   god — appears right beside you, takes it back out of your hands on the
   spot, carries it back to where it belongs, and sets it back down. Costs
   you 50 points once it's back in place — same idea as disturbing the body
   in the pyramid. Happens every time you try, not just the first. */
const SUN_OBJ_ID = 400;
const C1 = String.fromCodePoint(0x1305A); // falcon-headed god wearing the sun disk
const SUN_GUARDIAN_WALK_DURATION = 1.1; // seconds to carry it back home
const SUN_GUARDIAN_SIZE_MULT = 1.3; // reads a bit larger than an ordinary sign
const SUN_GUARDIAN_PENALTY = 50;
let sunGuardian = null; // { t, fromX, fromY, home:{x,y,scale,mirror,noHitbox,glyph} }

function triggerSunGuardian(home){
  heldItem = null; // taken right out of your hands, on the spot
  sunGuardian = {
    t: 0,
    fromX: player.x + (facing < 0 ? 0.05 : -0.05), fromY: player.y, // appears right beside you
    home,
  };
}

function updateSunGuardian(dt){
  if(!sunGuardian) return;
  sunGuardian.t += dt;
  if(sunGuardian.t >= SUN_GUARDIAN_WALK_DURATION){
    const { home } = sunGuardian;
    levelObjects.push({ id: SUN_OBJ_ID, glyph: home.glyph, x: home.x, y: home.y, scale: home.scale, pickup: true, mirror: home.mirror, noHitbox: home.noHitbox, items: [] });
    score -= SUN_GUARDIAN_PENALTY;
    sunGuardian = null;
  }
}

function sunGuardianPos(){
  const t = Math.min(1, sunGuardian.t / SUN_GUARDIAN_WALK_DURATION);
  const eased = t*(2-t); // eases out into the landing
  return {
    x: sunGuardian.fromX + (sunGuardian.home.x - sunGuardian.fromX) * eased,
    y: sunGuardian.fromY + (sunGuardian.home.y - sunGuardian.fromY) * eased,
  };
}

function drawSunGuardian(){
  if(!sunGuardian) return;
  const { x, y } = sunGuardianPos();
  const depthFactor = scaleForY(y);
  const size = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * depthFactor * SUN_GUARDIAN_SIZE_MULT;
  const dir = sunGuardian.home.x < x ? 1 : -1; // default orientation faces left, flip while walking rightward-to-left... (faces the way it's travelling)

  ctx.save();
  ctx.translate(x*W, y*H);
  ctx.scale(dir, 1);
  ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a1f14';
  ctx.fillText(C1, 0, 0);
  ctx.restore();

  // carries the sun along with it until it's set back down
  const sunSize = size * 0.5;
  ctx.save();
  ctx.translate(x*W + size*0.3*dir, y*H - size*0.25);
  ctx.font = sunSize.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#b8860b'; // reads gold, same as other prized reward items
  ctx.fillText(sunGuardian.home.glyph, 0, 0);
  ctx.restore();
}

function tryPickup(){
  const nb = nearestBase();
  if(nb){
    const { base, kind } = nb;
    if(base.items && base.items.length){
      // a stack always gives up whatever was placed on it last
      pickUpItem(base.items.pop());
      return;
    }
    if(kind === 'boat'){
      // picking up the WHOLE boat — not just unstacking its cargo — needs
      // you genuinely close to it. boatCatchZone() above is deliberately
      // wide so cargo can be loaded/unloaded from a comfortable distance;
      // reusing that same wide reach here meant an empty boat could get
      // swept onto your head by a stray pickup press from well outside
      // boarding range, leaving nothing there to walk into anymore —
      // exactly what made "connecting to the boat" seem to randomly break
      // once you were holding it (unknowingly holding the boat itself).
      const dist = Math.hypot((player.x-base.x)*W, (player.y-base.y)*H);
      if(dist < Math.min(W,H)*CAPTURE_RANGE*1.5){
        boatOnGround = null;
        heldItem = { kind:'boat' };
      }
      return;
    }
    if(kind === 'level' && base.pickup){
      // the sun's guardian only ever intervenes on the ORIGINAL sun object,
      // never a golden reward or anything else that happens to reuse the
      // glyph — so this has to be snapshotted before the object is spliced out
      const sunHome = base.id === SUN_OBJ_ID
        ? { x:base.x, y:base.y, scale:base.scale, mirror:base.mirror, noHitbox:base.noHitbox, glyph:base.glyph }
        : null;
      levelObjects.splice(levelObjects.indexOf(base), 1);
      if(selectedObjId === base.id) selectedObjId = null;
      if(base.id === BODY_ID && !bodyPenaltyGiven){
        score -= 30; // disturbing the body in the pyramid costs you
        bodyPenaltyGiven = true;
      }
      heldItem = { kind:'level', id:base.id, glyph:base.glyph, scale:base.scale, mirror:base.mirror, noHitbox:base.noHitbox, pickup:base.pickup, golden:base.golden };
      if(sunHome) triggerSunGuardian(sunHome);
      return;
    }
    // the base itself can't be lifted and has nothing left on it — fall through
  }
  // the free-roaming cow, if it isn't already tucked away in a stack
  // somewhere, and actually resting on the map that's currently active —
  // otherwise its lvl-1 x/y (or wherever it's resting) can coincide with a
  // spot on a map it was never brought to, making it invisibly pickable
  // there too
  if(!cow.placed && cow.map === currentMap){
    const dist = Math.hypot((player.x-cow.x)*W, (player.y-cow.y)*H);
    if(dist < Math.min(W,H)*CAPTURE_RANGE) pickUpItem({ kind:'cow' });
  }
}

function pickUpItem(item){
  heldItem = item;
  if(item.kind === 'cow'){ cow.carried = true; cow.placed = false; cow.state = 'carried'; }
}

function tryDropHeldItem(){
  const item = heldItem;
  heldItem = null;

  // handing one of the sacred birds to the lady while close enough feeds
  // her quest instead of just setting it down
  if(tryGiveBirdToLady(item)) return;
  // same idea on lvl -1: hand the man two of the pickup fish and he goes
  // and runs the elephant off instead of you just setting the fish down
  if(tryGiveFishToMan(item)) return;
  // and hand the woman 5 of the pickup snakes for a golden N5, same idea
  // as the lady's bird quest on lvl 1
  if(tryGiveSnakeToWoman(item)) return;
  // feed the cat one of the pickup fish (carried over from lvl -1 by boat,
  // same as anything else held) for 5 points — not a quest, just a snack
  if(tryGiveFishToCat(item)) return;

  // the boat only ever sits as its own base in the world — everything else
  // (the cow, any pickupable sign) is happy to stack onto whatever's nearby.
  // Two exceptions always go in loose, never stacked: the cow dropped into
  // the river (a boat-riding cow can't be hunted by the crocodile — that'd
  // defeat the whole point of the drop), and the golden reward set down
  // between the pillars (otherwise it just stacks onto the nearest obelisk
  // and the score for placing it never fires).
  const cowIntoWater = item.kind === 'cow' && isInWater(player.x, player.y);
  const goldenAtPillars = item.golden && nearPillars(player.x, player.y);
  if(item.kind !== 'boat' && !cowIntoWater && !goldenAtPillars){
    const nb = nearestBase();
    if(nb){
      nb.base.items = nb.base.items || [];
      nb.base.items.push(item);
      settleDroppedItem(item, true);
      return;
    }
  }
  settleDroppedItem(item, false);
}

// applies whatever's special about each kind once it comes to rest, whether
// it landed inside a stack or standalone on the ground
function settleDroppedItem(item, stacked){
  if(item.kind === 'cow'){
    cow.carried = false;
    cow.map = currentMap; // now actually resting on whichever map it just landed on
    if(stacked){
      cow.placed = true; // inert cargo now — no flee AI while it's tucked away on something
    } else {
      cow.placed = false;
      cow.x = player.x; cow.y = player.y;
      cow.baseX = player.x; cow.baseY = player.y; // its new "home" spot to flee from/return to
      cow.state = 'idle'; cow.pauseT = 0;
      cow.settleCooldown = 0.8; // a beat before it's willing to flee again
    }
    const distNpc = Math.hypot((player.x-npc.x)*W, (player.y-npc.y)*H);
    if(distNpc < Math.min(W,H)*NPC_TALK_RANGE){
      startNpcCelebration(); // he dances every time you bring it to him, wherever it lands
      if(!cowDelivered) score += 5; // saving the cow only pays out the first time
      cowDelivered = true; // the original "go find it" line is retired for good from the first delivery on
    }
  } else if(item.kind === 'boat' && !stacked){
    // a proper prize once it's off his head: 200% larger than the size he wore it at.
    // dropping it near the river snaps it the rest of the way in, so lining
    // it up exactly (especially approaching from the south bank) isn't fiddly.
    // Guarded by !stacked for the same reason as the level branch below: a
    // spare boat auto-dropped while boarding an already-placed one (tryAutoBoard
    // stacks whatever you're holding onto that boat's cargo) must NOT replace
    // boatOnGround here — that would swap out the boat you're standing in for
    // a brand new empty one and silently throw away everything on it.
    let bx = player.x, by = player.y;
    if(!isInWater(bx, by)){
      const [nx, ny] = nearestWaterPoint(bx, by);
      if(Math.hypot(nx-bx, ny-by) < BOAT_WATER_SNAP){ bx = nx; by = ny; }
    }
    boatOnGround = { x: bx, y: by, items: [] };
  } else if(item.kind === 'level' && !stacked){
    let dropX = player.x, dropY = player.y;
    if(item.golden && nearPillars(player.x, player.y)){
      const mid = pillarMidpoint();
      if(mid){ dropX = mid[0]; dropY = mid[1]; } // locks neatly between the two obelisks
      if(!goldenScored){ score += 5; goldenScored = true; }
    }
    levelObjects.push({
      id: item.id != null ? item.id : nextObjId++,
      glyph: item.glyph, x: dropX, y: dropY, scale: item.scale,
      pickup: item.pickup, mirror: item.mirror, noHitbox: item.noHitbox, items: [],
      golden: item.golden || false
    });
  }
}

function updateCow(dt){
  if(cow.carried || cow.placed) return; // riding on the player, or tucked away in a stack — no state of its own
  if(cow.map !== currentMap) return; // resting on a map that isn't currently active — nothing to react to

  const cowSizePx = Math.min(W,H) * COW_SIZE_MULT * scaleForY(cow.y);
  const fleeDist = 2 * (cowSizePx / W); // "2 character distances"
  const leftX = cow.baseX - fleeDist;

  if(cow.state === 'idle'){
    if(cow.settleCooldown > 0){
      cow.settleCooldown -= dt;
    } else {
      const dist = Math.hypot((player.x-cow.x)*W, (player.y-cow.y)*H);
      if(dist < Math.min(W,H)*COW_APPROACH_RANGE) cow.state = 'fleeing';
    }
  } else if(cow.state === 'fleeing'){
    cow.facing = 1; // moving left — the sign's default orientation, no mirror
    cow.x = Math.max(leftX, cow.x - COW_MOVE_SPEED*dt);
    if(cow.x <= leftX){ cow.state = 'paused'; cow.pauseT = 0; }
  } else if(cow.state === 'paused'){
    cow.pauseT += dt;
    if(cow.pauseT >= COW_PAUSE) cow.state = 'returning';
  } else if(cow.state === 'returning'){
    cow.facing = -1; // moving right — mirror the sign
    cow.x = Math.min(cow.baseX, cow.x + COW_MOVE_SPEED*dt);
    if(cow.x >= cow.baseX) cow.state = 'idle';
  }
}

const NPC_TALK_RANGE = 0.24; // fraction of min(W,H) — how close before the bubble shows

/* ---------- NPC delivery celebration ----------
   Drop the cow next to him and he plays a little sequence — A28, A32,
   A31, A32, A29 — then slowly flips left/right five times before
   settling back on his resting sign, A26. */
const NPC_CELEBRATE_SEQUENCE = [A28, A32, A31, A32, A29];
const NPC_STEP_TIME = 0.35;   // seconds per pose in the sequence
const NPC_MIRROR_TIME = 0.45; // seconds per flip — "slowly"
const npcAnim = { phase:'idle', t:0, step:0, mirrors:0, facing:1 };

function startNpcCelebration(){
  npcAnim.phase = 'sequence';
  npcAnim.t = 0;
  npcAnim.step = 0;
  npcAnim.mirrors = 0;
  npcAnim.facing = 1;
}

function updateNpcAnim(dt){
  if(npcAnim.phase === 'idle') return;
  npcAnim.t += dt;

  if(npcAnim.phase === 'sequence'){
    if(npcAnim.t >= NPC_STEP_TIME){
      npcAnim.t = 0;
      npcAnim.step++;
      if(npcAnim.step >= NPC_CELEBRATE_SEQUENCE.length){
        npcAnim.phase = 'mirroring';
      }
    }
  } else if(npcAnim.phase === 'mirroring'){
    if(npcAnim.t >= NPC_MIRROR_TIME){
      npcAnim.t = 0;
      npcAnim.facing *= -1;
      npcAnim.mirrors++;
      if(npcAnim.mirrors >= 5){
        npcAnim.phase = 'idle';
        npcAnim.facing = 1;
        if(!boatRewarded){
          boatRewarded = true; // the reward for delivering the cow, once he's done celebrating — only granted the first time
          if(!heldItem) heldItem = { kind:'boat' }; // hands free — wear it
          else boatOnGround = { x: player.x, y: player.y, items: [] }; // hands full — it waits for you on the ground instead
        }
      }
    }
  }
}

function npcGlyph(){
  if(npcAnim.phase === 'sequence') return NPC_CELEBRATE_SEQUENCE[npcAnim.step];
  if(npcAnim.phase === 'mirroring') return A29; // mirror A29 itself, not the whole sequence
  return A26;
}

function wrapText(context, text, maxWidth){
  const words = text.split(' ');
  const lines = [];
  let line = '';
  words.forEach(word=>{
    const test = line ? line+' '+word : word;
    if(context.measureText(test).width > maxWidth && line){
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  });
  if(line) lines.push(line);
  return lines;
}

function drawSpeechBubble(cx, bottomY, text, fontSize){
  ctx.save();
  ctx.font = fontSize.toFixed(0)+'px '+HIERO_FONT;
  const lines = wrapText(ctx, text, 170);
  const lineH = fontSize*1.35;
  const padX = 12, padY = 10;
  let textW = 0;
  lines.forEach(l=>{ textW = Math.max(textW, ctx.measureText(l).width); });
  const w = textW+padX*2, h = lines.length*lineH+padY*2;
  const x = cx-w/2, y = bottomY-h;
  const r = 8;

  ctx.fillStyle = '#fdf8ec';
  ctx.strokeStyle = 'rgba(40,30,20,0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // tail pointing down at the speaker
  ctx.beginPath();
  ctx.moveTo(cx-7,y+h); ctx.lineTo(cx+7,y+h); ctx.lineTo(cx,y+h+8);
  ctx.closePath();
  ctx.fillStyle = '#fdf8ec';
  ctx.fill();

  ctx.fillStyle = '#2a1f14';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  lines.forEach((l,i)=> ctx.fillText(l, cx, y+padY+fontSize*0.85+i*lineH));
  ctx.restore();
}

function drawNpc(showBubble){
  const s = scaleForY(npc.y);
  const size = Math.min(W,H) * NPC_SIZE_MULT * s;
  const sx = npc.x*W, sy = npc.y*H;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(npcAnim.facing, 1);
  ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a1f14';
  ctx.fillText(npcGlyph(), 0, 0);
  ctx.restore();

  if(showBubble){
    let bubbleText = null;
    if(cowDelivered){
      // the second line only shows once his celebration animation has fully played out
      if(npcAnim.phase === 'idle') bubbleText = npc.lineWithCow;
    } else if(!(heldItem && heldItem.kind === 'cow')){
      bubbleText = npc.line; // while carrying the cow but not yet delivered, no bubble at all — no early flash of the second line
    }
    if(bubbleText) drawSpeechBubble(sx, sy-size*0.75, bubbleText, 22);
  }
}

function drawCow(){
  const s = scaleForY(cow.y);
  const size = Math.min(W,H) * COW_SIZE_MULT * s;
  const sx = cow.x*W, sy = cow.y*H;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(cow.facing, 1); // mirror when heading back right
  ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a1f14';
  ctx.fillText(E3, 0, 0);
  ctx.restore();
}

function drawCroc(){
  const s = scaleForY(croc.y);
  const size = Math.min(W,H) * COW_SIZE_MULT * s;
  const sx = croc.x*W, sy = croc.y*H;
  const dir = (player.x < croc.x) ? 1 : -1; // faces the player — default orientation faces left
  const glyph = currentMap === -1 ? E24 : I3; // hippo on lvl -1's river, crocodile on lvl 1's

  ctx.save();
  clipToTopFraction(sx, sy, size, 0.70); // always riding low in the water — bottom 30% cropped away
  ctx.translate(sx, sy);
  ctx.scale(dir, 1);
  ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a1f14';
  ctx.fillText(glyph, 0, 0);
  ctx.restore();
}

function drawGameOver(){
  ctx.save();
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e9e4d8';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = (Math.min(W,H)*0.16).toFixed(1)+"px "+HIERO_FONT;
  ctx.fillText('𓂝𓈖𓂽', W/2, H/2);
  ctx.restore();
}

/* ---------- walk-cycle state ----------
   A1/A2 alternate on a fixed interval while moving; stopping
   always lands back on A1. */
const WALK_INTERVAL = 0.15 * 1.3; // 30% slower
const anim = { t:0, frame:0 };

function updateAnim(dt, moving){
  if(!moving){
    anim.t = 0;
    anim.frame = 0;
    return;
  }
  anim.t += dt;
  if(anim.t >= WALK_INTERVAL){
    anim.t = 0;
    anim.frame = anim.frame === 0 ? 1 : 0;
  }
}

function currentGlyph(){
  if(heldItem) return A9; // holding anything overrides the normal walk cycle
  return anim.frame === 0 ? A1 : A2;
}

/* ============================================================
   PLAYER — the current walk-cycle sign, sized off scaleForY(player.y).
   ============================================================ */
function drawPlayer(){
  const sx = player.x*W, sy = player.y*H;
  const s = scaleForY(player.y);
  const size = Math.min(W,H) * PLAYER_SIZE_MULT * s;
  const wading = !boarded && isInWater(player.x, player.y); // wading shows only the top 34% — chest-deep in the river, head always fully visible

  ctx.save();
  if(wading) clipHeadSafe(sx, sy, currentGlyph(), size, 0.34);
  ctx.translate(sx, sy);
  ctx.scale(facing, 1); // mirror when walking left so the sign faces the way it's moving
  ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a1f14';
  ctx.fillText(currentGlyph(), 0, 0);
  ctx.restore();

  if(heldItem){
    if(heldItem.kind === 'cow') drawCarriedCow(sx, sy, size);
    else if(heldItem.kind === 'boat') drawBoatOnHead(sx, sy, size);
    else if(heldItem.kind === 'level') drawHeldLevelObject(sx, sy, size);
  }
}

function drawHeldLevelObject(px, py, playerSize){
  const size = playerSize * heldItem.scale;
  const oy = py - playerSize*0.62;
  ctx.save();
  ctx.translate(px, oy);
  ctx.scale(heldItem.mirror ? -1 : 1, 1);
  ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = heldItem.golden ? '#b8860b' : '#2a1f14';
  ctx.fillText(heldItem.glyph, 0, 0);
  ctx.restore();
}

function drawCarriedCow(px, py, playerSize){
  // the cow riding upside-down on the player's head (no boat yet — that only appears after delivery)
  const cowSize = playerSize * 0.85;
  const cowY = py - playerSize*1.03; // midpoint between the original 1.15 offset and the touching-the-head 0.92 offset
  ctx.save();
  ctx.translate(px, cowY);
  ctx.scale(1, -1); // upside down
  ctx.font = cowSize.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a1f14';
  ctx.fillText(E3, 0, 0);
  ctx.restore();
}

function drawBoatOnHead(px, py, playerSize){
  // the reward: a boat balanced on the player's head once the cow is delivered and the npc's celebration is done.
  // (nothing is ever stacked on a worn item — cargo always comes off before the base itself can be lifted.)
  const boatSize = playerSize * 0.75;
  const boatY = py - playerSize*0.78; // raised further so it clears the top of the a9 pose's head entirely
  ctx.save();
  ctx.translate(px, boatY);
  ctx.font = boatSize.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a1f14';
  ctx.fillText(P1, 0, 0);
  ctx.restore();
}

function drawGroundBoat(){
  // the boat once dropped — sitting in the world at 200% larger than the size it was worn at
  if(!boatOnGround) return;
  const s = scaleForY(boatOnGround.y);
  const size = Math.min(W,H) * BOAT_SIZE_MULT * s * BOAT_DROP_SCALE;
  const sx = boatOnGround.x*W, sy = boatOnGround.y*H;
  const floating = isInWater(boatOnGround.x, boatOnGround.y); // sitting in the river shows only the top 70% — the hull rides low in the water

  ctx.save();
  if(floating) clipToTopFraction(sx, sy, size, 0.70);
  ctx.translate(sx, sy);
  // boatOnGround.facing (set only while boarded, in updateBoardedMovement)
  // instead of the shared `facing` var — that var keeps changing for the
  // on-foot walk cycle once you step out, which used to make an empty,
  // parked boat keep flipping to match your on-foot heading.
  ctx.scale(boatOnGround.facing || 1, 1);
  ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a1f14';
  ctx.fillText(P1, 0, 0);
  ctx.restore();

  drawStackedItems(boatOnGround.items, sx, sy, size);
}

// renders whatever's piled on top of a base (the boat, or a placed sign) —
// the cow rides upside-down (an old visual joke), any other sign sits
// right-side up, honoring its own mirror flag
function drawStackedItems(items, bx, by, baseSize){
  if(!items || !items.length) return;
  let y = by - baseSize*0.08;
  for(const it of items){
    if(it.kind === 'cow'){
      const s = baseSize * 0.55;
      ctx.save();
      ctx.translate(bx, y);
      ctx.scale(1, -1);
      ctx.font = s.toFixed(1)+'px '+HIERO_FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#2a1f14';
      ctx.fillText(E3, 0, 0);
      ctx.restore();
      y -= s*0.5;
    } else if(it.kind === 'level'){
      const s = baseSize * 0.55 * it.scale;
      ctx.save();
      ctx.translate(bx, y);
      ctx.scale(it.mirror ? -1 : 1, 1);
      ctx.font = s.toFixed(1)+'px '+HIERO_FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#2a1f14';
      ctx.fillText(it.glyph, 0, 0);
      ctx.restore();
      y -= s*0.5;
    }
  }
}

/* ---------- level-editor placed objects ---------- */
function drawLevelObject(obj, glyphOverride, mirrorOverride){
  const s = scaleForY(obj.y);
  const size = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * s * obj.scale;
  const sx = obj.x*W, sy = obj.y*H;
  const glyph = glyphOverride || obj.glyph;
  const mirror = mirrorOverride != null ? mirrorOverride : obj.mirror;
  // reveal < 1 crops away the sign's bottom, same top-fraction crop the
  // boat/crocodile use to sit low in the water — here it's for building
  // things that read as partly buried/hidden under the map instead. Uses
  // the head-safe version (see clipHeadSafe above) rather than a plain box
  // crop: a sign's actual ink doesn't always sit inside the plain box the
  // way clipToTopFraction assumes, so the plain crop could shave a bit off
  // the TOP of a tall sign even at reveal 100% — clipHeadSafe measures the
  // real ink and only ever extends the window upward to cover it, never in.
  const reveal = typeof obj.reveal === 'number' ? obj.reveal : 1;

  ctx.save();
  if(reveal < 1) clipHeadSafe(sx, sy, glyph, size, reveal);
  if(obj.opaque){
    // an ordinary hieroglyph glyph has plenty of open space inside its own
    // silhouette — the font draws an outline/shape with real gaps in it, not
    // a solid block — so anything drawn earlier in the stack shows straight
    // through those gaps. This lays down a solid ground-colored plate sized
    // to the glyph's own measured ink first, so it actually blocks whatever
    // is behind it instead of just layering on top of it.
    ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const m = ctx.measureText(glyph);
    const pad = size * 0.04;
    const left = sx - m.actualBoundingBoxLeft - pad;
    const right = sx + m.actualBoundingBoxRight + pad;
    const top = sy - m.actualBoundingBoxAscent - pad;
    const bottom = sy + m.actualBoundingBoxDescent + pad;
    ctx.fillStyle = papyrusPattern || '#e9e4d8';
    ctx.fillRect(left, top, right - left, bottom - top);
  }
  ctx.translate(sx, sy);
  ctx.scale(mirror ? -1 : 1, 1);
  ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = obj.golden ? '#b8860b' : '#2a1f14'; // the lady's reward reads as gold, not ink
  ctx.fillText(glyph, 0, 0);
  ctx.restore();

  drawStackedItems(obj.items, sx, sy, size);

  if(!editMode) return;
  if(obj.id === selectedObjId){
    ctx.save();
    ctx.strokeStyle = '#b3392c';
    ctx.lineWidth = 2;
    ctx.setLineDash([4,4]);
    ctx.beginPath();
    ctx.arc(sx, sy, size*0.65, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  if(obj.pickup){
    ctx.save();
    ctx.fillStyle = '#2f7a3d';
    ctx.beginPath();
    ctx.arc(sx+size*0.32, sy-size*0.42, 4, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  if(obj.noHitbox){
    ctx.save();
    ctx.fillStyle = '#2b6ca3';
    ctx.beginPath();
    ctx.arc(sx-size*0.32, sy-size*0.42, 4, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

/* ============================================================
   INPUT / UPDATE
   ============================================================ */
// A death restarts the whole run (score, items, quests — everything a page
// reload would clear) exactly as it always has, but it should come back on
// whichever level you died on rather than always dumping you back on lvl 1.
// The current map is the only thing worth carrying across the reload itself,
// so it rides through sessionStorage and gets consumed once, right after
// startup (see the RESPAWN_MAP_KEY read near the bottom of this file).
const RESPAWN_MAP_KEY = 'depthWalkRespawnMap';
function respawnAfterDeath(){
  try{ sessionStorage.setItem(RESPAWN_MAP_KEY, String(currentMap)); }catch(e){}
  location.reload();
}

const keys = {};
let spaceHeld = false;
// Android/mobile: tap a spot on the map to walk (or steer the boat) toward
// it instead of holding a direction key — see touchMoveDir() and the
// touchend listener below. Touching an actual movement key always wins:
// it clears whatever the last tap set, so the keyboard stays in full
// control the moment it's used, rather than fighting a stale tap target.
let touchMoveTarget = null; // {x,y} in the same 0..1 fraction space as player.x/y, or null
const MOVE_KEYS = ['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'];
window.addEventListener('keydown', e=>{
  const typing = document.activeElement && ['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
  if(typing) return; // let normal typing/editing happen in the panel's fields

  if(gameOver){
    // needs a deliberate, fresh press of Enter — not whatever arrow/space
    // key was still being held down at the moment you died (that was
    // instantly restarting the game via the browser's own key-repeat)
    if(e.key === 'Enter' && !e.repeat) respawnAfterDeath();
    return;
  }

  const k = e.key.toLowerCase();
  keys[k] = true;
  if(MOVE_KEYS.includes(k)) touchMoveTarget = null;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if(e.key === ' ' && !spaceHeld){
    spaceHeld = true;
    onSpacePress();
  }
  if(k === 'e'){ setEditMode(!editMode); }
  if(editMode && (e.key === 'Delete' || e.key === 'Backspace') && selectedObjId !== null){
    e.preventDefault();
    deleteSelectedObject();
  }
}, {passive:false});
window.addEventListener('keyup', e=>{
  keys[e.key.toLowerCase()] = false;
  if(e.key === ' ') spaceHeld = false;
});

// Direction (already unit-length, in the same fraction space player.x/y
// use) from (curX,curY) toward the last tapped spot — null once there's no
// target, whether that's because nothing was tapped, the keyboard took
// over, or the target was just reached (arriving clears it as a side
// effect, the same way a real walk-there stops once you're there).
const TOUCH_ARRIVE_DIST = 0.02;
function touchMoveDir(curX, curY){
  if(!touchMoveTarget) return null;
  const dx = touchMoveTarget.x - curX, dy = touchMoveTarget.y - curY;
  const dist = Math.hypot(dx, dy);
  if(dist < TOUCH_ARRIVE_DIST){ touchMoveTarget = null; return null; }
  return { dx: dx/dist, dy: dy/dist };
}

// A tap moves you there; a quick second tap near the same spot doubles as
// the space bar (pick up / drop / whatever onSpacePress does in context).
// Only wired for touch input — desktop mouse clicks keep their existing
// meaning (placing signs in the editor, restarting from the game-over
// screen), untouched by any of this.
const DOUBLE_TAP_MS = 350;
const DOUBLE_TAP_DIST = 0.05;
let lastTapT = 0, lastTapX = 0, lastTapY = 0;
canvas.addEventListener('touchend', e=>{
  if(editMode) return; // the editor keeps using its existing tap-to-place path
  if(!e.changedTouches || !e.changedTouches.length) return;
  e.preventDefault(); // stop the synthetic mouse click that would otherwise double-fire whatever this does
  if(gameOver){ respawnAfterDeath(); return; }

  const t = e.changedTouches[0];
  const rect = canvas.getBoundingClientRect();
  const fx = (t.clientX - rect.left) / rect.width;
  const fy = (t.clientY - rect.top) / rect.height;

  const now = performance.now();
  const isDoubleTap = (now - lastTapT) < DOUBLE_TAP_MS && Math.hypot(fx-lastTapX, fy-lastTapY) < DOUBLE_TAP_DIST;
  lastTapT = isDoubleTap ? 0 : now; // consumed — a third quick tap starts a fresh pair, not a chained "use"
  lastTapX = fx; lastTapY = fy;

  touchMoveTarget = { x: fx, y: fy };
  if(isDoubleTap) onSpacePress();
}, {passive:false});
canvas.addEventListener('mousedown', ()=>{ if(gameOver) respawnAfterDeath(); }); // "pressing" the game-over screen also restarts

/* ============================================================
   LEVEL EDITOR — DOM wiring. Movement/space are frozen while
   editMode is on; the canvas instead takes plain mouse clicks to
   place or select signs, and the side panel controls their size
   and pickupable flag.
   ============================================================ */
const gameWrap = document.getElementById('gameWrap');
const editorPanel = document.getElementById('editor');
const paletteEl = document.getElementById('palette');
const scaleSlider = document.getElementById('scaleSlider');
const scaleValueEl = document.getElementById('scaleValue');
const revealSlider = document.getElementById('revealSlider');
const revealValueEl = document.getElementById('revealValue');
const pickupCheck = document.getElementById('pickupCheck');
const mirrorCheck = document.getElementById('mirrorCheck');
const noHitboxCheck = document.getElementById('noHitboxCheck');
const opaqueCheck = document.getElementById('opaqueCheck');
const levelJsonEl = document.getElementById('levelJson');
const map1Btn = document.getElementById('map1Btn');
const mapNeg1Btn = document.getElementById('mapNeg1Btn');
const map2Btn = document.getElementById('map2Btn');
function updateMapButtons(){
  map1Btn.disabled = currentMap === 1;
  mapNeg1Btn.disabled = currentMap === -1;
  map2Btn.disabled = currentMap === 2;
}
let showDebug = false;
const debugCheck = document.getElementById('debugCheck');
debugCheck.addEventListener('change', ()=>{ showDebug = debugCheck.checked; });

function setEditMode(on){
  editMode = on;
  editorPanel.hidden = !on;
  gameWrap.classList.toggle('editing', on); // narrows the scroll viewport, not the map itself
  resize();
}

// populate the palette with every sign in the Egyptian Hieroglyphs block
(function buildPalette(){
  for(let cp = 0x13000; cp <= 0x1342E; cp++){
    const glyph = String.fromCodePoint(cp);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'palette-btn';
    btn.textContent = glyph;
    btn.title = 'U+' + cp.toString(16).toUpperCase();
    if(glyph === placeGlyph) btn.classList.add('active');
    btn.addEventListener('click', ()=>{
      paletteEl.querySelectorAll('.palette-btn.active').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      // with a sign selected, clicking the palette swaps ITS glyph in place
      // instead of changing what the next new placement uses — the same
      // dual-purpose pattern the scale/pickup/mirror/noHitbox controls use
      const obj = levelObjects.find(o=>o.id===selectedObjId);
      if(obj) obj.glyph = glyph; else placeGlyph = glyph;
    });
    paletteEl.appendChild(btn);
  }
})();

function refreshScaleLabel(v){ scaleValueEl.textContent = Number(v).toFixed(2)+'x'; }
refreshScaleLabel(scaleSlider.value);
function refreshRevealLabel(v){ revealValueEl.textContent = Math.round(Number(v)*100)+'%'; }
refreshRevealLabel(revealSlider.value);

scaleSlider.addEventListener('input', ()=>{
  const v = parseFloat(scaleSlider.value);
  refreshScaleLabel(v);
  const obj = levelObjects.find(o=>o.id===selectedObjId);
  if(obj) obj.scale = v;
  // always remember it as the size the next NEW placement uses too, whether
  // you dialed it in on a selected object or with nothing selected yet —
  // otherwise sizing an object right after placing it wouldn't stick for
  // the next one you place
  placeScale = v;
});

revealSlider.addEventListener('input', ()=>{
  const v = parseFloat(revealSlider.value);
  refreshRevealLabel(v);
  const obj = levelObjects.find(o=>o.id===selectedObjId);
  if(obj) obj.reveal = v;
  placeReveal = v; // same "sticks for the next placement" rule as scale
});

pickupCheck.addEventListener('change', ()=>{
  const obj = levelObjects.find(o=>o.id===selectedObjId);
  if(obj) obj.pickup = pickupCheck.checked; else placePickup = pickupCheck.checked;
});

mirrorCheck.addEventListener('change', ()=>{
  const obj = levelObjects.find(o=>o.id===selectedObjId);
  if(obj) obj.mirror = mirrorCheck.checked; else placeMirror = mirrorCheck.checked;
});

noHitboxCheck.addEventListener('change', ()=>{
  const obj = levelObjects.find(o=>o.id===selectedObjId);
  if(obj) obj.noHitbox = noHitboxCheck.checked; else placeNoHitbox = noHitboxCheck.checked;
});

opaqueCheck.addEventListener('change', ()=>{
  const obj = levelObjects.find(o=>o.id===selectedObjId);
  if(obj) obj.opaque = opaqueCheck.checked; else placeOpaque = opaqueCheck.checked;
});

function selectObject(obj){
  selectedObjId = obj ? obj.id : null;
  if(obj){
    scaleSlider.value = obj.scale;
    refreshScaleLabel(obj.scale);
    const reveal = typeof obj.reveal === 'number' ? obj.reveal : 1;
    revealSlider.value = reveal;
    refreshRevealLabel(reveal);
    pickupCheck.checked = obj.pickup;
    mirrorCheck.checked = !!obj.mirror;
    noHitboxCheck.checked = !!obj.noHitbox;
    opaqueCheck.checked = !!obj.opaque;
    // the palette highlight follows the selection too, so it always shows
    // which sign is about to be swapped in if you click another palette tile
    paletteEl.querySelectorAll('.palette-btn.active').forEach(b=>b.classList.remove('active'));
    const btn = Array.from(paletteEl.children).find(b=>b.textContent===obj.glyph);
    if(btn) btn.classList.add('active');
  }
}

function deleteSelectedObject(){
  const idx = levelObjects.findIndex(o=>o.id===selectedObjId);
  if(idx !== -1) levelObjects.splice(idx, 1);
  selectedObjId = null;
}
document.getElementById('deleteBtn').addEventListener('click', deleteSelectedObject);
map1Btn.addEventListener('click', ()=> setMap(1));
mapNeg1Btn.addEventListener('click', ()=> setMap(-1));
map2Btn.addEventListener('click', ()=> setMap(2));
updateMapButtons();

document.getElementById('exportBtn').addEventListener('click', ()=>{
  levelJsonEl.value = JSON.stringify(levelObjects, null, 2);
});
function sanitizeStackItem(it){
  if(!it || typeof it !== 'object') return null;
  if(it.kind === 'cow') return { kind:'cow' };
  if(it.kind === 'level' && typeof it.glyph === 'string'){
    return { kind:'level', glyph:it.glyph, scale:it.scale||1, mirror:!!it.mirror, noHitbox:!!it.noHitbox, pickup:!!it.pickup };
  }
  return null;
}

document.getElementById('importBtn').addEventListener('click', ()=>{
  try{
    const data = JSON.parse(levelJsonEl.value);
    if(!Array.isArray(data)) throw new Error('expected an array');
    levelObjects.length = 0;
    let maxId = 0;
    data.forEach(o=>{
      if(typeof o.glyph !== 'string' || typeof o.x !== 'number' || typeof o.y !== 'number') return;
      const id = typeof o.id === 'number' ? o.id : nextObjId++;
      maxId = Math.max(maxId, id);
      const items = Array.isArray(o.items) ? o.items.map(sanitizeStackItem).filter(Boolean) : [];
      levelObjects.push({ id, glyph:o.glyph, x:o.x, y:o.y, scale:o.scale||1, reveal: typeof o.reveal === 'number' ? o.reveal : 1, pickup:!!o.pickup, mirror:!!o.mirror, noHitbox:!!o.noHitbox, opaque:!!o.opaque, items });
    });
    nextObjId = Math.max(nextObjId, maxId+1);
    selectedObjId = null;
  }catch(err){
    alert('Could not import: '+err.message);
  }
});

let draggingObj = null;

function hitTestObject(cx, cy){
  let hit = null, hitDist = Infinity;
  for(const obj of levelObjects){
    const s = scaleForY(obj.y);
    const size = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * s * obj.scale;
    const d = Math.hypot(cx-obj.x*W, cy-obj.y*H);
    if(d < size*0.65 && d < hitDist){ hit = obj; hitDist = d; }
  }
  return hit;
}

canvas.addEventListener('mousedown', e=>{
  if(!editMode) return;
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  const fx = cx/W, fy = cy/H;

  // hit-test existing objects first — closest one within its own radius wins
  const hit = hitTestObject(cx, cy);

  if(hit){
    selectObject(hit);
    draggingObj = hit; // held while the mouse is down — see the window-level listeners below
  } else {
    const obj = { id: nextObjId++, glyph: placeGlyph, x: fx, y: fy, scale: placeScale, reveal: placeReveal, pickup: placePickup, mirror: placeMirror, noHitbox: placeNoHitbox, opaque: placeOpaque, items: [] };
    levelObjects.push(obj);
    selectObject(obj);
  }
});

window.addEventListener('mousemove', e=>{
  if(!editMode || !draggingObj) return;
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  draggingObj.x = Math.max(0, Math.min(1, cx/W));
  draggingObj.y = Math.max(0, Math.min(1, cy/H));
});
window.addEventListener('mouseup', ()=>{ draggingObj = null; });

/* ---------- collision ----------
   Nothing fancy: every solid is a circle in pixel space, sized off the
   same scaleForY() curve used to draw it, so "how big it looks" and
   "how big it blocks" always agree.

   For the walking figures (player/NPC/cow), the hitbox only covers the
   bottom 20% of the glyph — roughly its feet — instead of the whole
   sign. That's what lets a figure visually overlap something above its
   feet (an outstretched hand, another figure's head) while still only
   physically blocking when they're actually standing on the same spot. */
function feetHitbox(sx, sy, size, r){
  return { x:sx, y:sy+size*0.40, r };
}

function obstacleCircles(){
  // the npc never leaves lvl 1 — without this gate his fixed x/y would
  // still fall inside every other map's own 0..1 space too, leaving an
  // invisible obstacle sitting there on lvl -1 (and now blank lvl 2) even
  // though nothing's actually there — same bug class the cow's own `map`
  // field above was fixed for.
  const list = [];
  if(currentMap === 1){
    const npcSize = Math.min(W,H) * NPC_SIZE_MULT * scaleForY(npc.y);
    list.push(feetHitbox(npc.x*W, npc.y*H, npcSize, npcSize*0.16));
  }
  // skip the cow's hitbox while carried, for a beat after being set down
  // (otherwise it'd trap the player who's standing right on it), and on
  // whichever map it isn't currently resting on — same idea as the draw
  // gate below, so it can't block movement on a map it was never left on
  if(!cow.carried && !cow.placed && cow.settleCooldown<=0 && cow.map === currentMap){
    const cowSize = Math.min(W,H) * COW_SIZE_MULT * scaleForY(cow.y);
    list.push(feetHitbox(cow.x*W, cow.y*H, cowSize, cowSize*0.20));
  }
  // level-editor objects block movement by default — mark one "no hitbox" to let the player walk through it.
  // The glyph is drawn centered on obj.y (textBaseline 'middle'), spanning
  // roughly from -0.5*size to +0.5*size — but the hitbox itself only covers
  // the bottom quarter of that span (from +0.25*size to +0.5*size, centered
  // at +0.375*size with a radius that keeps it inside that band). That way a
  // tall sign or column only blocks the ground right at its base, the same
  // way its own footprint would in real life, instead of a circle centered
  // on the whole glyph blocking the player from ever walking near its top.
  // It's an ellipse rather than a circle: rx is wider than ry so a sign
  // still blocks its full visible width at the base, without the band
  // getting any taller than that bottom-quarter slice.
  for(const obj of levelObjects){
    if(obj.noHitbox || obj.id === ELEPHANT_OBJ_ID) continue; // the elephant handles its own contact once it's awake and moving
    const size = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * scaleForY(obj.y) * obj.scale;
    list.push({ x: obj.x*W, y: obj.y*H + size*0.375, rx: size*0.45, ry: size*0.125 });
  }
  return list;
}
function collidesAt(fx, fy){
  const size = Math.min(W,H) * PLAYER_SIZE_MULT * scaleForY(fy);
  const foot = feetHitbox(fx*W, fy*H, size, size*0.16);
  // Obstacles are either a plain circle ({r}, the npc/cow) or an ellipse
  // ({rx,ry}, level objects — see obstacleCircles above). Either way the
  // player's own foot circle is folded into both axes of the obstacle's
  // radius (the usual circle+circle Minkowski trick, just applied per axis
  // for the ellipse case), then it's a standard normalized-ellipse test.
  return obstacleCircles().some(o => {
    const orx = (o.rx != null ? o.rx : o.r) + foot.r;
    const ory = (o.ry != null ? o.ry : o.r) + foot.r;
    const dx = foot.x - o.x, dy = foot.y - o.y;
    return (dx*dx)/(orx*orx) + (dy*dy)/(ory*ory) < 1;
  });
}

/* ---------- river hazard: the crocodile (lvl 1) / hippo (lvl -1) ---------- */
// Drops the hazard roughly SPAWN_DISTANCE_DIAMETERS player-widths from the
// player, somewhere inside whichever river is active. Tries a handful of
// compass directions first (cheap, and keeps it from spawning behind an
// obviously dry bank); if none of those land in the water, it falls back to
// whichever point on that river's own outline sits closest to the target
// distance.
function trySpawnCroc(){
  const poly = activeWaterPoly();
  if(!poly) return;
  const size = Math.min(W,H) * PLAYER_SIZE_MULT * scaleForY(player.y);
  const distFrac = (size * 2 * SPAWN_DISTANCE_DIAMETERS) / Math.min(W,H);
  const angles = [0, Math.PI, 0.35, -0.35, Math.PI-0.35, Math.PI+0.35, Math.PI/2, -Math.PI/2];
  for(const a of angles){
    const cx = player.x + Math.cos(a)*distFrac;
    const cy = player.y + Math.sin(a)*distFrac;
    if(isInWater(cx, cy)){ croc = { x: cx, y: cy }; return; }
  }
  let best = null, bestDiff = Infinity;
  for(const p of poly){
    const diff = Math.abs(Math.hypot(p[0]-player.x, p[1]-player.y) - distFrac);
    if(diff < bestDiff){ bestDiff = diff; best = p; }
  }
  if(best) croc = { x: best[0], y: best[1] };
}

function updateCroc(dt){
  if(!croc) return;

  // it'll go after whichever's in the water — the player on foot, or (on
  // lvl 1 only — the cow never sets foot on lvl -1) a loose cow that got
  // dropped in there — and loses interest once neither is. (The reed
  // staircase reads as land — see isInWater() — so standing on it always
  // shakes the hippo off.)
  const playerInWater = !boarded && isInWater(player.x, player.y);
  const cowInWater = currentMap === 1 && !cow.carried && !cow.placed && isInWater(cow.x, cow.y);
  if(!playerInWater && !cowInWater){ croc = null; return; }

  let tx, ty, huntingCow;
  if(playerInWater && cowInWater){
    const dPlayer = Math.hypot(player.x-croc.x, player.y-croc.y);
    const dCow = Math.hypot(cow.x-croc.x, cow.y-croc.y);
    huntingCow = dCow < dPlayer;
  } else {
    huntingCow = cowInWater;
  }
  tx = huntingCow ? cow.x : player.x;
  ty = huntingCow ? cow.y : player.y;

  const depthFactor = scaleForY(croc.y);
  const speed = 0.30 * depthFactor * CROC_SPEED_MULT * dt;
  const dx = tx - croc.x, dy = ty - croc.y;
  const dist = Math.hypot(dx, dy);
  if(dist > 0.0001){
    croc.x += (dx/dist) * speed;
    croc.y += (dy/dist) * speed;
  }

  const size = Math.min(W,H) * COW_SIZE_MULT * depthFactor;
  const caughtDist = size * 0.5;
  const caught = Math.hypot((tx-croc.x)*W, (ty-croc.y)*H) < caughtDist;
  if(caught){
    // caught the cow or caught you — either way, it's game over
    gameOver = true;
  }
}

/* ---------- lvl -1 hazard: the elephant ---------- */
// The elephant sign placed in the level editor (id 277) sits there like any
// other static level object until you wander within ELEPHANT_WAKE_BODY_LENGTHS
// of its own on-screen size — then it wakes up and charges. From that point
// on it's driven by updateElephant()/drawElephant() instead of the normal
// static level-object pass (its object id is skipped there, see the drawList
// loop in render()), the same way the crocodile/hippo takes over its own draw.
function initElephant(){
  if(elephantGoneForGood){ elephant = null; return; }
  const obj = MAP_NEG1_OBJECTS.find(o => o.id === ELEPHANT_OBJ_ID);
  elephant = obj ? { x: obj.x, y: obj.y, homeX: obj.x, homeY: obj.y, scale: obj.scale, awake: false } : null;
}

function drawElephant(){
  if(!elephant) return;
  const depthFactor = scaleForY(elephant.y);
  const size = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * depthFactor * elephant.scale;
  const sx = elephant.x*W, sy = elephant.y*H;
  const dir = (player.x < elephant.x) ? 1 : -1; // faces the player once it's awake and charging

  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(elephant.awake ? dir : -1, 1); // asleep, it keeps its placed (mirrored) orientation
  ctx.font = size.toFixed(1)+'px '+HIERO_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a1f14';
  ctx.fillText(E25, 0, 0);
  ctx.restore();
}

function updateElephant(dt){
  // land hazard, lvl -1 only, and it can't reach you out on the water
  if(currentMap !== -1 || !elephant || boarded) return;

  const depthFactor = scaleForY(elephant.y);
  const size = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * depthFactor * elephant.scale;
  const pixelDist = Math.hypot((player.x-elephant.x)*W, (player.y-elephant.y)*H);

  if(!elephant.awake){
    if(pixelDist < size * ELEPHANT_WAKE_BODY_LENGTHS) elephant.awake = true;
    else return;
  }

  // once you're past its own boundary line, it gives up the chase and
  // heads back to where it started instead of just sitting there pinned
  // to the line waiting for you to come back
  const retreating = player.x > elephantBoundaryX(player.y);
  const targetX = retreating ? elephant.homeX : player.x;
  const targetY = retreating ? elephant.homeY : player.y;

  const speed = 0.30 * depthFactor * ELEPHANT_SPEED_MULT * dt;
  const dx = targetX - elephant.x, dy = targetY - elephant.y;
  const dist = Math.hypot(dx, dy);
  if(dist <= speed){
    elephant.x = targetX; elephant.y = targetY;
    if(retreating) elephant.awake = false; // safely home — back to sleep
  } else {
    elephant.x += (dx/dist) * speed;
    elephant.y += (dy/dist) * speed;
  }
  // it'll press right up against its own boundary and track the player's
  // depth along it, but it never actually crosses to the far side
  const maxX = elephantBoundaryX(elephant.y);
  if(elephant.x > maxX) elephant.x = maxX;

  if(!retreating){
    const caughtDist = size * 0.5;
    const caught = Math.hypot((player.x-elephant.x)*W, (player.y-elephant.y)*H) < caughtDist;
    if(caught) gameOver = true;
  }
}

/* ---------- lvl -1 quest: the man south of the reed staircase ----------
   Hand him 2 of the level's 3 pickup fish and he walks off to confront the
   elephant himself — once he reaches it, it's gone for the rest of this
   visit to lvl -1 (see elephantGoneForGood above), then he walks back home.
   Leaving and coming back to lvl -1 (see setMap(-1)) starts the whole thing
   over: the elephant, and the quest to send it away again. */
const MAN_ID = 279; // the standing 𓀙 figure just south of the yellow zone
const MAN_TALK_RANGE = 0.24; // fraction of min(W,H) — matches the lady's on lvl 1
const MAN_QUEST_LINE = '𓏎𓇋𓆞2';
const FISH_IDS = [382, 383, 384]; // the level's 3 pickup fish — any 2 satisfy him
const FISH_QUEST_TARGET = 2;
const MAN_WALK_DURATION = 1.4; // seconds, each leg of the walk out and back
let fishDelivered = 0;
let manQuestDone = false;
let manWalk = null; // { phase:'out'|'back', t, fromX, fromY, toX, toY } — drives the cutscene
const manObj = MAP_NEG1_OBJECTS.find(o => o.id === MAN_ID) || null;

/* ---------- the pickup fish sway in place ----------
   Purely cosmetic: each of the 3 collectible fish glyphs drifts back and
   forth along its own patch of water while it's still sitting there
   uncollected. Moves the object's actual x, not just how it's drawn, so
   picking one up still just grabs whichever is currently in reach — once
   it's picked up it leaves levelObjects for good and simply stops moving. */
const FISH_SWIM_SPAN = 2.5; // total back-and-forth travel, in multiples of its own on-screen size
const FISH_SWIM_PERIOD = 3.2; // seconds per full back-and-forth cycle
let fishSwimT = 0;

function updateFishSwim(dt){
  if(currentMap !== -1) return;
  fishSwimT += dt;
  for(const obj of levelObjects){
    if(!FISH_IDS.includes(obj.id)) continue;
    if(obj._swimBaseX === undefined) obj._swimBaseX = obj.x; // remembers its resting spot the first time it's seen
    const size = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * scaleForY(obj.y) * obj.scale;
    const amplitude = (size * FISH_SWIM_SPAN * 0.5) / W; // half the total span, in the same 0..1 fraction obj.x uses
    const phase = obj.id % 7; // staggers the three so they don't all swim in lockstep
    const theta = (fishSwimT + phase) * (Math.PI*2/FISH_SWIM_PERIOD);
    obj.x = obj._swimBaseX + Math.sin(theta) * amplitude;
    obj.mirror = Math.cos(theta) > 0; // faces whichever way it's currently swimming — default glyph faces left
  }
}

/* ---------- the hippo sign on lvl -1's riverbank (level object id 276) ----------
   Sits on the left side of the river. Purely cosmetic, same idea as the
   pickup fish's sway above: paces back and forth along the bank without
   wandering off its post. */
const HIPPO_ID = 276;
const HIPPO_SWAY_SPAN = 2; // total back-and-forth travel, in multiples of its own on-screen size
const HIPPO_SWAY_PERIOD = 4; // seconds per full back-and-forth cycle
let hippoSwayT = 0;
const hippoObj = MAP_NEG1_OBJECTS.find(o => o.id === HIPPO_ID) || null;

function updateHippoSway(dt){
  if(currentMap !== -1 || !hippoObj) return;
  hippoSwayT += dt;
  if(hippoObj._baseX === undefined) hippoObj._baseX = hippoObj.x; // remembers its resting spot the first time it's seen
  const size = Math.min(W,H) * LEVEL_OBJ_BASE_MULT * scaleForY(hippoObj.y) * hippoObj.scale;
  const amplitude = (size * HIPPO_SWAY_SPAN * 0.5) / W; // half the total span, in the same 0..1 fraction obj.x uses
  const theta = hippoSwayT * (Math.PI*2/HIPPO_SWAY_PERIOD);
  hippoObj.x = hippoObj._baseX + Math.sin(theta) * amplitude;
  hippoObj.mirror = Math.cos(theta) > 0; // faces whichever way it's currently moving
}

/* ---------- the cat (level object id 411) ----------
   Sits on lvl 1. Hand it one of the pickup fish — the same 3 signs the
   man's quest uses on lvl -1, carried across by boat like anything else
   held — and it eats it for 5 points. Not a one-time quest: every fish
   handed over pays out again. */
const CAT_ID = 411;
const CAT_TALK_RANGE = 0.20; // fraction of min(W,H)
const CAT_FEED_REWARD = 5;
const CAT_SPEECH_DURATION = 5; // seconds it pauses and "talks" after being fed
const CAT_SPEECH_LINE = '𓏇𓇋𓅱𓃠';
let catSpeechT = 0;
const catObj = MAP1_OBJECTS.find(o => o.id === CAT_ID) || null;

// called from tryDropHeldItem() — handing it a fish while close enough
// consumes it instead of just setting it down; returns true if so
function tryGiveFishToCat(item){
  if(currentMap !== 1 || !catObj || item.kind !== 'level' || !FISH_IDS.includes(item.id)) return false;
  const dist = Math.hypot((player.x-catObj.x)*W, (player.y-catObj.y)*H);
  if(dist >= Math.min(W,H)*CAT_TALK_RANGE) return false;
  score += CAT_FEED_REWARD;
  catSpeechT = CAT_SPEECH_DURATION; // freezes its zigzag and shows its line for a beat
  return true;
}

/* ---------- the cat roams a little zigzag ----------
   Purely cosmetic, same idea as the pickup fish's sway above but on both
   axes: paces back and forth AND up and down around its resting spot
   instead of along a single line. Moves the object's actual x/y (not just
   the drawn position), same as the fish. Uses a linear ramp (triangle
   wave) rather than a smooth sine — sharp turnarounds instead of a round
   loop is what actually reads as a "zigzag" — and the vertical leg runs on
